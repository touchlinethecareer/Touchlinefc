<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Touchline Career</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a floodlit pitch at night. Mowing stripes behind a three-column matchday console:
   player card left, the next fixture centre, the league table right. Single dark look by choice. */
:root{
  --night:#0a1611; --panel:#0f2318; --panel-2:#15301f; --panel-3:#1b3b27;
  --chalk:#eef1e4; --chalk-dim:#9db1a0; --chalk-faint:#6f8a76; --line:rgba(238,241,228,.12);
  --amber:#f4b740; --amber-ink:#2b1d00; --red:#ef6a52; --win:#6fd497; --draw:#d4c97a;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:
    repeating-linear-gradient(90deg,rgba(238,241,228,.022) 0 90px,transparent 90px 180px),
    radial-gradient(1200px 500px at 50% -120px,rgba(244,183,64,.10),transparent 70%),
    var(--night);
  color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 48px;
}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;line-height:1}
h2{font-size:26px;font-weight:800}
h3{font-size:18px;font-weight:800;letter-spacing:.05em}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{background:var(--panel-3);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-weight:600}
.btn:hover{background:#224a31}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.05em;padding:12px 22px}
.btn.primary:hover{background:#ffc95c}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:900;letter-spacing:.03em}
.brand h1 span{color:var(--amber)}
.top-meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top-meta div{display:flex;flex-direction:column}
.top-meta b{font-family:var(--f-mono);font-size:15px;font-weight:600}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* Hub grid */
.hub{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1060px){.hub{grid-template-columns:300px minmax(0,1fr)}.hub .side{grid-column:1/-1}}
@media (max-width:720px){.hub{grid-template-columns:minmax(0,1fr)}}

/* Player card */
.card{background:linear-gradient(160deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card-top{display:grid;grid-template-columns:1fr auto;gap:8px;padding:18px 18px 12px;position:relative}
.kit{position:absolute;right:0;top:0;bottom:0;width:10px}
.ovr{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:.85;color:var(--amber)}
.ovr-wrap{text-align:right;padding-right:14px}
.pname{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:.95;word-break:break-word}
.pmeta{color:var(--chalk-dim);font-size:13px;margin-top:6px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.attr{display:grid;grid-template-columns:34px 26px 1fr;align-items:center;gap:6px}
.attr .k{font-family:var(--f-mono);font-size:11px;color:var(--chalk-dim);letter-spacing:.08em}
.attr .v{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right}
.bar{height:5px;background:rgba(238,241,228,.08);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--chalk-dim);border-radius:3px;transition:width .4s}
.t-hi i{background:var(--amber)} .t-mid i{background:var(--chalk)} .t-lo i{background:var(--chalk-faint)}
.v.t-hi{color:var(--amber)}
.meters{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.meter{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.meter .bar{height:6px}
.meter.low i{background:var(--red)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:12px 18px 18px;border-top:1px solid var(--line)}
.facts b{display:block;font-family:var(--f-mono);font-weight:600;font-size:14px}

/* Fixture */
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px 0 18px}
.team{display:flex;flex-direction:column;gap:8px;min-width:0}
.team.away{align-items:flex-end;text-align:right}
.team .nm{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1;word-break:break-word}
.crest{width:38px;height:44px;border-radius:4px 4px 19px 19px;border:1px solid rgba(255,255,255,.25)}
.vs{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--chalk-faint)}
.str{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--chalk-dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:4px;background:var(--panel-3);color:var(--chalk)}
.chip.amber{background:var(--amber);color:var(--amber-ink)}
.chip.red{background:rgba(239,106,82,.18);color:var(--red)}
.chip.green{background:rgba(111,212,151,.15);color:var(--win)}

.section{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--night);border-color:var(--chalk)}
.seg button small{display:block;font-weight:400;font-size:11px;opacity:.75}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}

.report{background:var(--panel-2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.score{font-family:var(--f-display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.score .res{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:2px 6px;margin-right:8px;font-size:22px;vertical-align:middle}
.res.W{background:var(--win);color:#06200f}.res.D{background:var(--draw);color:#262200}.res.L{background:var(--red);color:#2b0800}
.statline{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.statline b{font-family:var(--f-mono)}
.rating{font-family:var(--f-mono);font-weight:600;padding:2px 7px;border-radius:4px;background:var(--panel-3)}
.rating.hi{background:var(--amber);color:var(--amber-ink)}
.rating.lo{background:rgba(239,106,82,.2);color:var(--red)}
.commentary{color:var(--chalk-dim);font-style:italic}

.log{display:flex;flex-direction:column;max-height:300px;overflow:auto}
.log-row{display:grid;grid-template-columns:30px 26px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row .res{font-family:var(--f-mono);font-size:11px;text-align:center;border-radius:3px;padding:2px 0;font-weight:600}
.log-row .opp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;width:22px}
tr.me td{color:var(--amber);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.scroll{overflow-x:auto}
.stats4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats4 div b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}

/* Career strip */
.career{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.career{grid-template-columns:minmax(0,1fr)}}
.hist td,.hist th{white-space:nowrap}
.hist td:nth-child(2),.hist th:nth-child(2){text-align:left}
.cabinet{display:flex;flex-wrap:wrap;gap:8px}
.trophy{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:13px}
.trophy svg{flex:none}
.trophy small{display:block;color:var(--chalk-dim);font-family:var(--f-mono);font-size:11px}
.empty{color:var(--chalk-faint);font-size:14px}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:820px){.setup{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px}
input[type=text],select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--chalk);padding:10px 12px;font:inherit;width:100%;min-width:0}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.club{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 0;text-align:left;overflow:hidden}
.club .stripe{align-self:stretch}
.club b{display:block;font-weight:700}
.club small{color:var(--chalk-dim);font-size:12px}
.club[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.club .s{font-family:var(--f-mono);font-weight:600}
.intro{max-width:62ch;color:var(--chalk-dim)}
.hero-title{font-size:clamp(44px,8vw,86px);font-weight:900;line-height:.85}
.hero-title span{color:var(--amber)}

/* End / transfer / retire */
.big-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.offer{display:flex;flex-direction:column;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.offer .stripe{position:absolute;left:0;top:0;right:0;height:6px}
.offer h3{font-size:24px;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv span{color:var(--chalk-dim)} .kv b{font-family:var(--f-mono);font-weight:600;text-align:right}
.headline{font-family:var(--f-display);font-weight:900;font-size:clamp(36px,6vw,60px);text-transform:uppercase;line-height:.9}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:8px;align-items:baseline}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(4,10,7,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;max-width:480px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;background:var(--panel-3);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.choices button:hover{border-color:var(--amber)}
.choices small{display:block;color:var(--chalk-dim);font-size:12px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--chalk-dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .35s ease-out}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
.tabs button{background:transparent;border:0;border-radius:6px;padding:8px 12px;font-weight:600;font-size:14px;color:var(--chalk-dim)}
.tabs button[aria-pressed="true"]{background:var(--chalk);color:var(--night)}
.metabar{display:flex;gap:18px 22px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.metabar div{display:flex;flex-direction:column}
.metabar b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.hint{font-size:12.5px;color:var(--chalk-dim)}
.sub{display:block;font-size:11.5px;color:var(--chalk-dim);font-weight:400}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.feed li{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:8px}
.world{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:960px){.world{grid-template-columns:minmax(0,1fr)}}
.lb td,.lb th{white-space:nowrap}
.lb td:nth-child(2),.lb th:nth-child(2),.lb td:nth-child(6),.lb th:nth-child(6){text-align:left}
.gold{color:var(--amber)}
.btn.mini{padding:5px 9px;font-size:12px}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:baseline}
.cmp b{font-family:var(--f-mono);text-align:right;font-weight:600}
.cmp b.label{font-family:var(--f-mono);font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp .win{color:var(--win)}.cmp .lose{color:var(--red)}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.vote{background:var(--panel-2);border-radius:8px;padding:12px 14px}
.vote ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.vote li small{display:block;color:var(--chalk-dim);font-size:11px}
.vote li.me{color:var(--amber);font-weight:700}
textarea{width:100%;min-height:70px;margin-top:8px;background:var(--panel-2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;font:12px var(--f-mono);padding:8px}
.comps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.comps li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:7px}
.comps li span{display:flex;gap:6px;align-items:center;font-weight:600}
.comps li small{color:var(--chalk-dim);text-align:right;font-family:var(--f-mono);font-size:11.5px}
.comps li.won small{color:var(--amber)}.comps li.out{opacity:.6}
tr.cut td{border-bottom:2px solid var(--amber)}
button.log-row{background:transparent;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:inherit;font:inherit;font-size:13px;cursor:pointer}
button.log-row:hover{background:var(--panel-2)}
.fixture.intl{background:linear-gradient(90deg,rgba(244,183,64,.06),transparent 60%);border-radius:8px}
.teaser{max-width:560px}
.tz-board{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tz-team{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.tz-team.r{align-items:flex-end;text-align:right}
.tz-team b{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1;word-break:break-word}
.tz-score{font-family:var(--f-display);font-weight:900;font-size:52px;line-height:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.tz-score small{font-family:var(--f-mono);font-size:13px;color:var(--amber);font-weight:600}
.tz-pitch{position:relative;height:34px;border-radius:6px;background:repeating-linear-gradient(90deg,#1d5a35 0 28px,#226640 28px 56px);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.tz-pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.45)}
.tz-pitch i{position:absolute;left:0;bottom:0;height:3px;background:var(--amber);width:0}
.tz-pitch span{position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;transition:left .35s}
.tz-ev{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.tz-ev li{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:14px;padding:6px 8px;border-radius:6px;background:var(--panel-3);animation:pop .3s ease-out}
.tz-ev li.goal{background:rgba(244,183,64,.16);font-weight:600}
.tz-ev li.goal.them{background:rgba(239,106,82,.16)}
.tz-ev li.me{border-left:3px solid var(--amber)}
.tz-ev .num{color:var(--chalk-dim)}
.cele{position:relative;overflow:hidden;text-align:center;align-items:center;background:radial-gradient(circle at 50% 25%,rgba(244,183,64,.25),var(--panel-2) 60%)}
.cele-art{filter:drop-shadow(0 8px 24px rgba(244,183,64,.45));animation:rise .7s ease-out}
@keyframes rise{from{transform:translateY(18px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.cele-title{font-size:clamp(30px,6vw,44px);color:var(--amber)}
.confetti{position:absolute;inset:0;pointer-events:none}
.podium{display:flex;flex-wrap:wrap;gap:14px}
.podium figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel-2);border-radius:10px;padding:12px 14px;width:150px;text-align:center}
.podium figcaption{font-size:13px;font-weight:600}
.trophy.dim{opacity:.7}
.trophy svg{flex:none}
.academy-pick{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.academy-pick b{display:block;font-size:16px}
.party-code{font-family:var(--f-display);font-weight:900;font-size:44px;letter-spacing:.18em;color:var(--amber);line-height:1}
.rv td.lead{color:var(--amber);font-weight:700}
.rv td,.rv th{white-space:nowrap}
.mgr-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.mgr-card .kit{position:absolute;right:0;top:0;bottom:0;width:10px}
button.offer.choice{text-align:left;cursor:pointer;color:inherit;font:inherit}
button.offer.choice:hover{border-color:var(--amber)}
.party-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--amber);border-radius:10px;padding:14px 16px}
.chip.green{background:rgba(111,212,151,.15);color:var(--win)}
.btn:disabled{opacity:.45;cursor:not-allowed}

function realStars(endY){
  const out=[];

function roundRobin(n){
  const t=[...Array(n).keys()],rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];pr.push(r%2?[b,a]:[a,b])}rounds.push(pr);t.splice(1,0,t.pop())}
  return rounds.concat(rounds.map(pr=>pr.map(([a,b])=>[b,a])));
}
const blankRow=()=>({P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
function mkGroup(pool,double){
  const sorted=pool.slice().sort((a,b)=>team(b).s-team(a).s);

  const opp=pots.map(p=>pick(p.length?p:sorted)).filter((v,i,a)=>a.indexOf(v)===i);
  while(opp.length<3){const x=pick(sorted);if(!opp.includes(x))opp.push(x)}
  return {opp,tbl:[0,1,2,3].map(()=>blankRow()),rounds:roundRobin(4),n:double?6:3,done:false,rank:null};
}

    else if(mm&&m.mok&&(m.moment||'').match(/teammate/)&&pa>0){t=mm;who=`${scorerName()} scores, assisted by YOU`;pa--;me=true;mm=null}
    else if(pg>0&&m.min){who='YOU score';pg--;me=true}
    else if(pa>0&&m.min){who=`${scorerName()} scores, assisted by YOU`;pa--;me=true}

    ev.push({m:t,s:'us',k:'goal',t:who,me});
  });
  om.forEach(t=>{let who=`${scorerName()} scores for ${o.n}`;if(mm&&!m.mok&&m.mmin){t=mm;who=m.mred?`Red card for YOU. ${o.n} score from the free kick`:`${o.n} score. You couldn't stop it`;mm=null}ev.push({m:t,s:'them',k:'goal',t:who})});
  if(m.min){

    if(m.sv)for(let i=0;i<Math.min(3,m.sv);i++)ev.push({m:RI(3,89),s:'them',k:'save',t:pick(['Brilliant save by YOU','YOU tip it over the bar','YOU stand tall and block'])});
    if(m.tk+m.ic>=5)ev.push({m:RI(Math.max(on,10),Math.min(off,88)),s:'us',k:'chance',t:'Crunching tackle by YOU wins it back'});
    if(m.mmin&&!ev.some(e=>e.m===m.mmin))ev.push({m:m.mmin,s:'us',k:'chance',t:m.moment});
    if(m.injNow)ev.push({m:RI(Math.max(on,20),Math.min(off,88)),s:'us',k:'card',t:`YOU go down injured (${m.injNow.toLowerCase()})`});
  }
  for(let i=0;i<RI(1,3);i++)ev.push({m:RI(10,88),s:Math.random()<.5?'us':'them',k:'card',t:`Yellow card for ${scorerName()}`});
  if(m.pens)ev.push({m:120,s:m.pens==='W'?'us':'them',k:'goal',t:`Penalty shootout: ${m.pensScore[0]}–${m.pensScore[1]}. ${m.pens==='W'?'You go through!':'Heartbreak.'}`});

}
function commentary(m){
  const o=team(m.opp).n;
  if(m.why==='Injured')return `Still out with a ${(P().injName||'knock').toLowerCase()}. You watched from the stands.`;
  if(m.why==='Suspended')return 'Suspended. You watched from the stands.';
  if(m.why==='Personal leave')return 'You missed the match on personal leave.';
  if(m.trainNote&&!m.min)return m.trainNote+' You missed the match.';
  if(m.why)return pick(['An evening on the bench. The manager kept you in reserve.','No minutes. Better ratings and training are the way into the XI.','Unused substitute again. Trust is earned slowly.']);
  const bits=[];
  if(m.rival)bits.push(`Rivalry game against ${m.rival}.`);
  if(m.moment)bits.push(m.moment);
  if(m.g>=3)bits.push(`A hat-trick! ${o} could not live with you.`);
  else if(m.g===2)bits.push('Two goals and the crowd is singing your name.');
  else if(m.g===1&&!m.moment)bits.push(pick(['You found the net with a composed finish.','A sharp finish puts your name on the scoresheet.','Right place, right time. A poacher\'s goal.']));
  else if(!m.g&&m.sh>=4)bits.push(`${m.sh} shots, no goal. The keeper had your number.`);
  if(m.a&&!m.moment)bits.push(m.a>1?`${m.a} assists, pure vision.`:'You set one up with a clever pass.');
  if(m.sv>=5)bits.push(`${m.sv} saves. You kept your side in it.`);
  if(m.tk+m.ic>=6)bits.push('You won the ball back again and again.');
  if(m.cs)bits.push('A clean sheet.');
  if(m.pens)bits.push(m.pens==='W'?'Through on penalties after a tense finish.':'Knocked out on penalties.');
  if(bits.length<=(m.rival?1:0))bits.push(m.r>=7.2?'A busy, intelligent performance.':m.r<6?'A night to forget. Nothing came off.':m.sub?'A short cameo off the bench.':'A steady shift without a big moment.');
  if(m.injNow)bits.push(`You limped off: ${m.injNow.toLowerCase()}.`);
  return bits.join(' ');
}
function simRound(r,res){
  const se=S.season,ui=myClub().c;
  se.rounds[r].forEach(([h,a])=>{
    let gh,ga;
    if(h===ui||a===ui){const mine=h===ui;gh=mine?res.gA:res.gB;ga=mine?res.gB:res.gA}
    else if(partyLeague()){[gh,ga]=partyScore(se.year,se.l,r,h,a)}
    else{const sh=club(se.l+'-'+h).s,sa=club(se.l+'-'+a).s;gh=poisson(1.3*Math.exp((sh-sa)/15)*1.12);ga=poisson(1.3*Math.exp((sa-sh)/15)*.92)}
    rowAdd(se.table[h],gh,ga);rowAdd(se.table[a],ga,gh);
  });
}
function rowAdd(T,f,a){T.P++;T.GF+=f;T.GA+=a;if(f>a){T.W++;T.Pts+=3}else if(f<a)T.L++;else{T.D++;T.Pts++}}
const sortRows=t=>t.slice().sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF);
const sortTable=sortRows;
function progress(f,res){
  const se=S.season,comp=compOf(f),p=P();
  if(f.t==='L'){
    se.month.push(res.r);
    if(se.month.length>=4){const pl=se.month.filter(v=>v!=null);const av=pl.length?pl.reduce((a,b)=>a+b,0)/pl.length:0;
      if(pl.length>=3&&av>=7.9+D().aw&&!S.academy){se.stats.potm++;S.potm++;news(`${p.name} named ${LEAGUES[se.l].name} Player of the Month.`)}se.month=[]}
    return;
  }
  if(f.c==='iw'){if(compLabel(f).includes('qualifier')){S.ntq.pts+=res.outcome==='W'?3:res.outcome==='D'?1:0;S.ntq.n++}return}
  if(f.k==='G'){
    const g=comp.group,oi=g.opp.indexOf(f.opp)+1;
    rowAdd(g.tbl[0],res.gA,res.gB);rowAdd(g.tbl[oi],res.gB,res.gA);
    const other=g.rounds[f.gi].find(p=>!p.includes(0));
    if(other){const [h,a]=other,th=team(g.opp[h-1]),ta=team(g.opp[a-1]);const gh=poisson(1.3*Math.exp((th.s-ta.s)/15)*(comp.intl?1:1.1)),ga=poisson(1.3*Math.exp((ta.s-th.s)/15)*(comp.intl?1:.95));rowAdd(g.tbl[h],gh,ga);rowAdd(g.tbl[a],ga,gh)}
    if(f.gi===g.n-1){
      g.done=true;const order=g.tbl.map((t,i)=>({...t,i})).sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF);
      g.rank=order.findIndex(t=>t.i===0)+1;
      if(g.rank>2){comp.alive=false;comp.elim='group stage';news(`${ourTeam(f).n} knocked out of the ${comp.name} group stage.`)}
      else news(`${ourTeam(f).n} reach the ${comp.name} knockouts.`);
    }
    return;
  }
  if(f.k==='K'){
    if(res.outcome==='L'){comp.alive=false;comp.elim=comp.stages[f.stage].toLowerCase()}
    else{comp.ko=f.stage+1;
      if(f.stage===comp.stages.length-1){comp.won=true;comp.alive=false;
        const nm=comp.name,intl=!!comp.intl,youth=!!comp.youth||(!intl&&S.academy);
        addTrophy(nm,{intl,youth,sub:intl?`${p.nation}${youth?' youth':''}`:myClub().n});
        news(intl?`${p.nation} win the ${nm}!`:`${myClub().n} win the ${nm}!`);
        if(f.c==='cont')S.contWins.push({club:S.clubId,y:S.year+1});
        if(f.c==='cont')S.csuperClub=S.clubId;
        if(f.c==='cup')S.flags.cupWon=true;
        if(intl&&!youth)S.intl.tourn.push({y:S.year+1,name:nm,res:'Champions'});
      }
    }
    if(!comp.alive&&!comp.won&&comp.intl&&!comp.youth)S.intl.tourn.push({y:S.year+1,name:comp.name,res:comp.elim});
  }
}
function isImportant(f,res){
  if(!res.min&&!res.gA&&!res.gB)return false;
  if(res.rival)return true;
  if(f.t==='L')return f.r===S.season.rounds.length-1;
  if(f.c==='iw')return false;
  const comp=compOf(f);
  if(comp.intl)return true;
  if(f.k==='K')return comp.stages.length-f.stage<=2||comp.kind==='super';
  return false;
}

/* ---------- Week flow ---------- */
function playWeek(){
  const f=curFixture();
  if(!f)return toEnd();
  const note=train();
  const sel=selection(f);
  S.pending={note,sel,min:0};
  if(f.t==='L'&&partyLeague())f.fixed=partyFixed(f);
  const big=f.k==='K'||(f.t==='I'&&f.c!=='iw');
  if(sel.min&&!f.fixed&&Math.random()<(sel.sub?.12:big?.35:.2)){S.pending.type=momentFor(P().pos);S.pending.min=sel.sub?RI(70,89):RI(8,88);return 'moment'}
  return finishWeek();
}
function finishWeek(){
  const se=S.season,f=curFixture(),pm=S.pending;
  const res=playMatch(f,pm.note,pm.sel,pm.mod);
  S.pending=null;
  if(f.t==='L')simRound(f.r,res);
  if(f.fixed){S.pc.lines[lineKey(f)]={min:res.min,g:res.g,a:res.a,r:res.r};res.friends=friendLines(f);
    res.friends.forEach(x=>res.ev.push({m:90,s:x.side,k:'chance',t:x.ln?(x.ln.min?`${x.n} (your friend): ${x.ln.min}', ${x.ln.g} goals, ${x.ln.a} assists, rating ${(+x.ln.r).toFixed(1)}`:`${x.n} (your friend) didn't play`):`${x.n} (your friend) hasn't played this round yet`}))}
  progress(f,res);
  if(f.t!=='I')S.player.money+=S.contract.wage*(f.t==='L'?1:.5);
  if(S.academy&&res.min&&f.t!=='I')S.scout=clamp(S.scout+(res.r-6.7)*2.2+res.g*.8+res.a*.5,0,100);
  if(S.academy&&res.min&&f.t==='I')S.scout=clamp(S.scout+(res.r-6.7)*3+res.g*1.2,0,100);
  se.week++;se.last=res;se.log.unshift(res);if(se.log.length>45)se.log.pop();
  const imp=isImportant(f,res);
  skipDead();
  if(se.week>=se.fixtures.length){
    if(!se.summerDone){se.summerDone=true;const t=setupSummer();if(t){S.notice=t;if(imp)S.teaser=true;return 'summer'}}
    if(imp){S.teaser=true;S.after='end';return 'teaser'}
    return toEnd();
  }
  if(imp){S.teaser=true;return 'teaser'}
  if(Math.random()<.34){const ev=rollEvent();if(ev){S.event=ev;return 'event'}}
  return 'ok';
}
function toEnd(){endSeason();return 'end'}
function afterStep(r){
  save();

  render();if(r==='end')window.scrollTo({top:0});
}
function onPlay(){S.simming=false;afterStep(playWeek())}
function onSim(){S.simming=true;let r,n=0;do{r=playWeek();n++}while(r==='ok'&&n<60);if(r==='end')S.simming=false;save();render();if(r==='end')window.scrollTo({top:0})}
function resumeAfterModal(){
  if(S.after==='end'){S.after=null;endSeason();save();render();window.scrollTo({top:0});return}

const ADJ_SCALE={normal:1.2,hard:1.6,legend:2};
function adj(k,v){const p=P();p[k]=clamp(p[k]+v*(ADJ_SCALE[S.diff]||1.6),0,100)}
function rollEvent(){const ids=Object.keys(EVENTS).filter(k=>!EVENTS[k].w||EVENTS[k].w());return ids.length?pick(ids):null}
function showEvent(){
  const ev=(S.mgr&&S.mgr.active?MEVENTS:EVENTS)[S.event];if(!ev){S.event=null;return}
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="evt"><div class="modal-box pop">
    <span class="label">Off the pitch</span><h2 id="evt">${ev.t}</h2><p style="margin:0">${esc(ev.b())}</p>
    <div class="choices">${ev.c.map((c,i)=>`<button data-ch="${i}">${c.l}<small>${c.h}</small></button>`).join('')}</div></div></div>`;
  modal.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
    const out=ev.c[+b.dataset.ch].fx();
    modal.querySelector('.modal-box').innerHTML=`<span class="label">Outcome</span><h2>${ev.t}</h2><p style="margin:0">${esc(out)}</p><div class="actions"><button class="btn primary" id="evOk">Continue</button></div>`;
    S.event=null;save();
    evOk.onclick=()=>{modal.innerHTML='';resumeAfterModal()};evOk.focus();
  });
  modal.querySelector('[data-ch]').focus();
}

/* ---------- Awards ---------- */
function myAwardScore(o,avg,st,ist,tr){
  const p=P(),pos=POS[p.pos],apps=st.apps+ist.apps,g=st.goals+ist.goals,a=st.ast+ist.ast;
  let s=o+pos.adj+(avg-7)*5.5*Math.min(1,apps/26);
  s+=tr.reduce((x,t)=>x+(MAJOR.includes(t)?2.2:/Championship|Copa América|Asian Cup|Africa Cup|Gold Cup/.test(t)?1.6:/U-\d/.test(t)?.3:.9),0);
  s+=Math.min(4.5,p.pos==='FWD'?(g+a*.6)*.045:p.pos==='MID'?(g+a)*.05:(st.cs+ist.cs)*.09+g*.06);
  s+=Math.min(1.5,st.motm*.08+st.potm*.2)-D().gb;
  if(apps<16)s-=12;
  return s;
}
function voteRank(myScore,pool,noise,useRivals){
  const rows=pool.map(s=>({n:s.n,nat:s.nat,club:s.cn||'',regen:!!s.regen,score:s.o+POS[s.pos].adj+n01()*noise+(s.o>=88?R(0,2.5):0)}));
  if(useRivals)allRivals().forEach(r=>{if(r.bd&&r.bd[S.season.year]!=null)rows.push({n:r.player,nat:r.nation,club:r.club,score:+r.bd[S.season.year],human:true})});
  rows.push({n:P().name,nat:P().nation,club:myClub().n,score:myScore+n01()*.6,me:true});
  rows.sort((a,b)=>b.score-a.score);
  return {rank:rows.findIndex(r=>r.me)+1,top:rows.slice(0,10)};
}
function endSeason(){
  const se=S.season,p=P(),c=myClub(),lg=LEAGUES[se.l],o=ovr(),st=se.stats,ist=se.istats,dd=D(),youth=S.academy;
  const tbl=sortTable(se.table),pos=tbl.findIndex(t=>t.i===c.c)+1;
  const allR=st.rs.concat(ist.rs),avg=allR.length?allR.reduce((a,b)=>a+b,0)/allR.length:0;
  const clubAvg=st.rs.length?st.rs.reduce((a,b)=>a+b,0)/st.rs.length:0;
  if(pos===1)addTrophy(lg.name,{youth,sub:c.n});
  const tr=(se.won||[]).slice(),aw=[];
  const top=RI(15,23),endY=se.year+1;
  let votes={};
  if(youth){
    if(st.apps>=12&&clubAvg>=7.3+dd.aw)aw.push('Academy Player of the Year');
    if(st.goals>=RI(13,19))aw.push('Youth Golden Boot');
  }else{
    if(st.ast>=RI(11,15))aw.push(`${lg.name} Playmaker Award`);
    if(st.apps>=16&&clubAvg>=7.35+dd.aw)aw.push(`${lg.name} Team of the Season`);
    const gsQ=lg.conf==='EU'&&!(endY>=1992&&endY<=1996)&&st.lg*lg.coef>=R(42,54);
    const pkQ=endY>=2009&&!!se.pusk&&Math.random()<.3;
    if(ist.apps>=5&&ist.rs.reduce((a,b)=>a+b,0)/ist.apps>=7.35+dd.aw&&!se.comps.nt?.youth)aw.push(`${p.nation} Player of the Year`);
    const nt=se.comps.nt;
    const ntAvg=ist.apps?ist.rs.reduce((a,b)=>a+b,0)/ist.apps:0;
    const gbQ=!!(nt&&!nt.youth&&ist.apps>=4&&(nt.won||nt.ko>=nt.stages.length-2)&&ntAvg>=7.4);
    const mj={eu:lg.conf==='EU',gsG:st.lg,gs:Math.round(st.lg*lg.coef*10)/10,gsQ,pk:!!se.pusk&&endY>=2009,pkQ,gb:nt&&!nt.youth?nt.name:null,gbN:ist.apps,gbAvg:+ntAvg.toFixed(2),gbQ};
    const sc=myAwardScore(o,avg,st,ist,tr);
    S.meHl=myHighlights(st,ist,tr,clubAvg,p.pos);
    const eligible=endY>=2007||(endY>=1995&&lg.conf==='EU')||nation(p.nation)[2]==='EU';
    S.bd[se.year]=Math.round(sc*10)/10;
    if(inParty()){S.pc.vmeta[se.year]={elig:eligible,young:p.age<=21,pos:p.pos,eu:lg.conf==='EU',club:c.n,l:se.l,lgName:lg.name,goals:st.lg,avg:+clubAvg.toFixed(2),apps:st.apps,age:p.age,hl:S.meHl,conf:natConf(p.nation),cs:st.cs,mj};S.pendVote={year:se.year}}
    else{
      const sv=soloVoteAll(sc,endY,eligible,lg.conf==='EU',p,c.n);Object.assign(votes,sv.votes);sv.aw.forEach(x=>aw.push(x));
      const lr=leagueAwardsFor(endY,se.l,lg.name,[{n:p.name,nat:p.nation,club:c.n,me:true,goals:st.lg,avg:clubAvg,apps:st.apps,age:p.age,hl:S.meHl,cs:st.cs,pos:p.pos}],Math.random,{top,pots:7.6+dd.aw,ypots:7.25+dd.aw,cs:RI(9,13)});
      lr.won.forEach(x=>aw.push(x));
      const mr=majorEntries(endY,[{n:p.name,nat:p.nation,club:c.n,me:true,hl:S.meHl,mj}],Math.random);
      mr.won.forEach(x=>aw.push(x));
      S.pendCer={lg:lr.list.concat(mr.list),gl:globalEntries(votes,endY)};
    }
  }
  if(youth&&ist.apps>=3&&ist.rs.reduce((a,b)=>a+b,0)/ist.apps>=7.2)aw.push(`${p.nation} Youth Player of the Year`);
  if(youth)specCeremony(se.year);
  aw.forEach(a=>{S.awards.push({n:a,y:seasonLabel(se.year),youth});if(a!=="Ballon d'Or")news(`${p.name} wins the ${a}.`)});
  if(S.pendCer){S.cele.push(ceremonyItem(se.year,S.pendCer.lg,S.pendCer.gl,aw.filter(x=>!S.pendCer.lg.some(e=>e.n===x)&&!S.pendCer.gl.some(e=>e.n===x))));S.pendCer=null}
  p.rep=clamp(p.rep+(youth?0:(clubAvg?(clubAvg-6.8)*9*Math.min(1,st.apps/20):0))+tr.length*(youth?1:4)+aw.length*(youth?1:4)+(ist.apps?2:0),0,100);
  S.history.push({y:se.year,age:p.age,club:c.n,k1:c.k1,k2:c.k2,league:lg.name,apps:st.apps,g:st.goals,a:st.ast,cs:st.cs,avg:+clubAvg.toFixed(2),pos,ovr:o,tr:tr.length,youth,loan:!!S.contract.loan,motm:st.motm,bd:votes.bd?votes.bd.rank:null,caps:ist.apps});
  if(!youth){
    const pro=S.history.filter(h=>!h.youth);
    S.line[p.age]={apps:pro.reduce((x,h)=>x+h.apps,0),g:pro.reduce((x,h)=>x+h.g,0),a:pro.reduce((x,h)=>x+h.a,0),tr:S.trophies.filter(t=>!t.youth).length,ovr:o};
    const cq=lg.coef>=2?4:2;
    S.contClub=pos<=cq?S.clubId:null;
    S.cont2Club=(pos>cq&&pos<=cq+2)||(S.flags.cupWon&&pos>cq)?S.clubId:null;
    S.superClub=(pos===1||S.flags.cupWon)?S.clubId:null;
    S.cont2Cup=!!(S.flags.cupWon&&pos>cq);
  }
  S.flags.cupWon=false;
  if(youth)S.scout=clamp(S.scout+(clubAvg-6.7)*8+(o-45)*1.5+aw.length*8+tr.length*3,0,100);
  p.age++;
  if(p.age>=31)p.attrs=p.attrs.map((v,i)=>Math.max(30,v-((i===0||i===5)?R(1,3.2):(p.age>=33?R(0,1.5):R(0,.6)))));
  p.fitness=95;p.form=[];p.injury=Math.max(0,p.injury-6);if(!p.injury)p.injName='';
  if(!youth){S.contract.years--;if(S.parent)S.parent.contract.years--}
  if(Math.random()<.5)S.flags.natban=false;
  S.flags.busy=false;
  ageStars();
  S.summary={year:se.year,pos,tr,aw,avg,clubAvg,st:{...st,rs:null},ist:{...ist,rs:null},top,votes,oldOvr:o,newOvr:ovr(),youth,
    comps:Object.entries(se.comps).filter(([k])=>k!=='iw').map(([k,v])=>({n:v.name,won:!!v.won,elim:v.elim||null,ko:v.ko||0,stages:v.stages,group:v.group?v.group.rank:null}))};
  S.phase='end';
  publishCareer();
  if(S.pendVote){publishMemberNow();tryResolveVotes()}
}

/* ---------- Transfers ---------- */
function offerFrom(id,o,extra){const w=Math.round(wageFor(o,club(id).s)*R(.88,1.15));return {id,wage:w,bonus:Math.round(w*RI(4,12)),years:P().age>=32?RI(1,2):RI(2,5),...extra}}
function genOffers(){
  const p=P(),o=ovr(),offers=[];
  S.forced=false;
  if(S.academy){
    if(p.age>=17||(p.age>=16&&S.scout>=75)){
      const parent=academyParent();
      if(parent&&S.scout>=40&&club(parent).s-o<=22)offers.push(offerFrom(parent,o,{pro:true,years:3,bonus:Math.round(wageFor(o,club(parent).s)*6)}));
      allPro().forEach(id=>{if(id===parent)return;const d=club(id).s-o;if(d>15||d<-8)return;
        const pr=(S.scout/100)*.38-Math.max(0,d-4)*.025;if(Math.random()<pr)offers.push(offerFrom(id,o,{pro:true,years:RI(2,3)}))});
      if(p.age>=19&&!offers.length){const fb=allPro().sort((a,b)=>club(a).s-club(b).s)[0];offers.push(offerFrom(fb,o,{pro:true,trial:true,years:1}))}
    }
    S.offers=offers.slice(0,1).concat(shuffle(offers.slice(1)).slice(0,4)).sort((a,b)=>club(b.id).s-club(a.id).s);S.phase='transfer';return;
  }
  allPro().forEach(id=>{
    if(id===S.clubId)return;
    const d=club(id).s-o;if(d>7||d<-14)return;
    const pr=.11+p.rep/320-Math.max(0,d)*.025+(S.flags.leak?.14:0);
    if(Math.random()<pr)offers.push(offerFrom(id,o));
  });
  let list=shuffle(offers).slice(0,5);
  const me=myClub();
  if(!S.contract.loan&&!S.flags.req&&(S.contract.years<=1||o>me.s+3)){const w=Math.max(S.contract.wage,Math.round(wageFor(o,me.s)*R(.95,1.1)));list.push({id:S.clubId,renew:true,wage:w,bonus:Math.round(w*RI(2,6)),years:p.age>=32?RI(1,2):RI(2,4)})}
  if(S.parent&&S.parent.contract.years>0)list.push({id:S.parent.id,ret:true,wage:S.parent.contract.wage,bonus:0,years:S.parent.contract.years});
  if(!S.parent&&p.age<=22&&['Reserve','Squad player'].includes(role(o,me.s))){
    shuffle(allPro().filter(id=>{const d=club(id).s-o;return id!==S.clubId&&d<=1&&d>=-6})).slice(0,2).forEach(id=>list.push({id,loan:true,wage:S.contract.wage,bonus:0,years:1}));
  }
  if(S.contract.years<=0&&!list.some(x=>!x.loan)){
    const fb=allPro().filter(id=>id!==S.clubId).sort((a,b)=>Math.abs(club(a).s-(o-4))-Math.abs(club(b).s-(o-4)))[0];
    list.push(offerFrom(fb,o));
  }
  if(inParty())partyOffers(list,o);
  list.sort((a,b)=>club(b.id).s-club(a.id).s);
  S.offers=list;S.flags.leak=false;S.flags.req=false;
  S.forced=p.age>=40||(p.age>=36&&o<64);
  S.phase='transfer';
}
function negotiate(i){
  const of=S.offers[i];if(!of||of.neg)return;
  of.neg=true;
  const chance=.5-(of.renew?0:.05)+(P().rep-40)/220;
  if(Math.random()<chance){of.wage=Math.round(of.wage*1.2);of.bonus=Math.round(of.bonus*1.3);flash=`${club(of.id).n} agreed to your terms: +20% wages.`}
  else if(Math.random()<.55){S.offers.splice(i,1);flash=`${club(of.id).n} walked away from talks.`}
  else flash=`${club(of.id).n} refused to improve the offer. It's still on the table.`;
  save();render();
}
function accept(i){
  const off=i===-1?null:S.offers[i];
  if(off){
    if(off.loan){S.parent={id:S.clubId,contract:{...S.contract}};S.clubId=off.id;S.contract={wage:off.wage,years:1,loan:true};news(`${P().name} joins ${club(off.id).n} on loan.`)}
    else if(off.ret){S.clubId=S.parent.id;S.contract={...S.parent.contract};S.parent=null}
    else{
      if(off.id!==S.clubId){S.player.trust=45;S.player.morale=clamp(S.player.morale+10,0,100);news(off.pro?`${P().name} signs a first pro contract with ${club(off.id).n}.`:`${P().name} completes a move to ${club(off.id).n}.`)}
      else news(`${P().name} signs a new deal at ${club(off.id).n}.`);
      S.clubId=off.id;S.contract={wage:off.wage,years:off.years};S.parent=null;
    }
    P().money+=off.bonus||0;
    if(off.pro){S.academy=false;S.player.trust=42;S.player.rep=Math.max(S.player.rep,5)}
    if(!S.clubs.includes(S.clubId)&&!S.academy)S.clubs.push(S.clubId);
  }
  advanceYear();
}
function retire(){S.phase='retired';news(`${P().name} retires from football at ${P().age}.`);save();publishCareer();render();window.scrollTo({top:0})}

/* ---------- Legacy ---------- */
function legacyOf(st){
  const p=st.player,H=st.history.filter(h=>!h.youth);
  const g=H.reduce((a,h)=>a+h.g,0)+(st.intl.goals||0),a=H.reduce((x,h)=>x+h.a,0),cs=H.reduce((x,h)=>x+h.cs,0);
  const peak=Math.max(ovrOf(p.attrs,p.pos),...st.history.map(h=>h.ovr),0);
  const tr=st.trophies.filter(t=>!t.youth&&!t.mgr),aw=st.awards.filter(t=>!t.youth&&!t.mgr);
  const majors=tr.filter(t=>MAJOR.includes(t.n)).length,bds=aw.filter(x=>/Ballon/.test(x.n)).length;
  return Math.round(g+a*.6+(p.pos==='GK'||p.pos==='DEF'?cs*.8:0)+tr.length*12+majors*20+aw.length*8+st.intl.caps*.5+bds*60+Math.max(0,peak-75)*3);
}

/* ---------- Online: shared world + rivals ---------- */
function careerSummary(){
  const p=P(),H=S.history.filter(h=>!h.youth),c=myClub();
  return {v:3,cid:S.cid,player:p.name,nation:p.nation,pos:p.pos,age:p.age,ovr:ovr(),club:c.n,clubId:S.clubId,k1:c.k1,league:LEAGUES[c.l].name,diff:S.diff,year:S.year,
    retired:S.phase!=='hub'&&S.phase!=='end'&&S.phase!=='transfer',party:S.party||null,mgr:S.mgr?{seasons:S.mgr.seasons.length,trophies:S.trophies.filter(t=>t.mgr).length,active:!!S.mgr.active,club:myClub().n}:null,academy:!!S.academy,apps:H.reduce((a,h)=>a+h.apps,0),goals:H.reduce((a,h)=>a+h.g,0),ast:H.reduce((a,h)=>a+h.a,0),
    trophies:S.trophies.filter(t=>!t.youth).length,majors:S.trophies.filter(t=>MAJOR.includes(t.n)).map(t=>t.n+' '+t.y).slice(-12),
    awards:S.awards.filter(t=>!t.youth).length,bdWins:S.awards.filter(a=>/Ballon/.test(a.n)).length,bdBest:S.bdBest||null,caps:S.intl.caps,
    legacy:legacyOf(S),bd:Object.fromEntries(Object.entries(S.bd||{}).slice(-25)),line:S.line,news:(S.news||[]).slice(0,15),updated:Date.now()};
}
function publishCareer(){
  if(!DB||!UID||canPost===false||!S)return;
  DB.doc('careers/'+UID).set(careerSummary()).then(()=>{canPost=true}).catch(e=>{if(e&&e.code==='invalid_argument'){canPost=false;if(view==='world')render()}});
}
function allRivals(){
  const list=[];
  W.forEach(w=>{if(w.uid!==UID)list.push({...w,src:'online'})});
  (S&&S.rivals||[]).forEach(r=>{if(!list.some(x=>x.cid===r.cid))list.push({...r,src:'code'})});
  return list;
}
async function initOnline(){
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<20){await new Promise(r=>setTimeout(r,250));tries++}
  if(!(window.claude&&window.claude.use)){online='off';return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){online='off';if(view==='world')render();return}
    const id=await user.id();if(!id){online='off';if(view==='world')render();return}
    DB=db;USER=user;UID=id;online='on';
    try{const can=await user.can('data.write');if(can===false)canPost=false}catch(e){}
    try{const snap=await db.doc(`data/users/${id}/save`).get();
      if(snap.exists){const d=snap.data();const rs=d&&d.state?JSON.parse(d.state):null;
        if(rs&&rs.player&&(!S||(rs.updated||0)>(S.updated||0))){S=rs;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}}}catch(e){}
    db.collection('careers').limit(300).onSnapshot(q=>{
      W=q.docs.filter(d=>d.exists).map(d=>({uid:d.id,...d.data()}));
      const ids=W.map(w=>w.uid).filter(x=>!NAMES[x]);
      if(ids.length)user.profiles(ids).then(ps=>{Object.values(ps).forEach(p=>NAMES[p.id]=p.name||'');if(view==='world')render()}).catch(()=>{});
      if(view==='world')render();
    },()=>{});
    if(S&&S.player&&canPost!==false)publishCareer();
    if(inParty()){subscribeParty(S.party);publishMemberNow()}
    if(view==='world'||(S&&S.phase==='waitNext'))render();
  }catch(e){online='off';if(view==='world')render()}
}
function rivalCode(){const s=careerSummary();delete s.news;return 'TL3:'+btoa(unescape(encodeURIComponent(JSON.stringify(s))))}
function addRivalCode(txt){
  try{const t=txt.trim();if(!t.startsWith('TL3:'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));
    if(!d||!d.cid||!d.player)throw 0;if(d.cid===S.cid)return 'That\'s your own code.';
    const clean={cid:String(d.cid).slice(0,12),player:String(d.player).slice(0,28),nation:String(d.nation||'').slice(0,30),pos:POS[d.pos]?d.pos:'FWD',age:+d.age||0,ovr:+d.ovr||0,club:String(d.club||'').slice(0,40),clubId:String(d.clubId||''),k1:/^#[0-9a-f]{6}$/i.test(d.k1)?d.k1:'#888888',league:String(d.league||'').slice(0,40),diff:DIFF[d.diff]?d.diff:'hard',year:+d.year||0,retired:!!d.retired,academy:!!d.academy,apps:+d.apps||0,goals:+d.goals||0,ast:+d.ast||0,trophies:+d.trophies||0,awards:+d.awards||0,bdWins:+d.bdWins||0,bdBest:d.bdBest?+d.bdBest:null,caps:+d.caps||0,legacy:+d.legacy||0,bd:{},line:{},updated:+d.updated||Date.now()};
    Object.entries(d.bd||{}).forEach(([k,v])=>{if(+k>2000&&isFinite(+v))clean.bd[k]=+v});
    Object.entries(d.line||{}).forEach(([k,v])=>{if(+k>0&&v)clean.line[k]={apps:+v.apps||0,g:+v.g||0,a:+v.a||0,tr:+v.tr||0,ovr:+v.ovr||0}});
    S.rivals=(S.rivals||[]).filter(r=>r.cid!==clean.cid);S.rivals.push(clean);save();return `Added ${clean.player} as a rival.`;
  }catch(e){return 'That code doesn\'t look right. Ask your friend to copy it again.'}
}

const TACTICS={
  balanced:{n:'Balanced',d:'No extremes'},
  attacking:{n:'All-out attack',d:'Score more, concede more'},
  defensive:{n:'Park the bus',d:'Few goals either way'},
  counter:{n:'Counter-attack',d:'Best against stronger teams'},
  possession:{n:'Possession',d:'Best against weaker teams'},
  press:{n:'High press',d:'Strong but exhausting'}
};
const M=()=>S.mgr;
function budgetFor(s){return Math.round(Math.pow(1.16,s-58)*1.2e6)}
function genMgrJobs(first){
  const rep=M().rep,offers=[];
  const cap=first?(rep>=70?84:rep>=45?78:rep>=25?72:66):Math.min(90,58+rep*.34);
  const pool=shuffle(allPro().filter(id=>{const s=club(id).s;return s<=cap+1&&s>=cap-14&&id!==S.clubId}));
  pool.slice(0,first?4:RI(1,4)).forEach(id=>{const c=club(id);offers.push({id,years:RI(2,4),wage:Math.round(wageFor(70,c.s)*.8)})});
  if(!offers.length){const id=allPro().sort((a,b)=>club(a).s-club(b).s)[0];offers.push({id,years:2,wage:wageFor(60,club(id).s)})}
  S.mgrOffers=offers.sort((a,b)=>club(b.id).s-club(a.id).s);
}
function startManager(){
  const leg=legacyOf(S);
  S.mgr={active:true,startAge:P().age,rep:clamp(Math.round(leg/9),5,85),board:60,morale:60,fatigue:15,tactic:'balanced',rotate:false,build:0,budget:0,
    rec:{w:0,d:0,l:0},seasons:[],sacked:0,inj:0,month:[],potm:0,clubs:[]};
  S.playerFinal={legacy:leg,tier:legacyTier(leg)};S.mgrAdvance=true;
  news(`${P().name} begins a coaching career.`);
  genMgrJobs(true);S.phase='mgrJobs';S.academy=false;save();publishCareer();render();window.scrollTo({top:0});
}
function takeJob(i){
  const o=S.mgrOffers[i];
  if(S.clubId!==o.id){M().build=0;M().board=60;M().morale=60;M().fatigue=15;news(`${P().name} appointed manager of ${club(o.id).n}.`)}
  S.clubId=o.id;S.contract={wage:o.wage,years:o.years};M().clubs.includes(o.id)||M().clubs.push(o.id);
  M().budget=budgetFor(club(o.id).s);
  if(S.phase==='mgrJobs'&&S.mgrSeasonPending){S.mgrSeasonPending=false}
  S.mgrOffers=null;S.year+=S.mgrAdvance?1:0;S.mgrAdvance=false;
  mgrNewSeason();
}
function mgrStrength(){return myClub().s+clamp(M().build,-6,5)}
function expectedPos(){const lg=LEAGUES[myClub().l];const me=mgrStrength();return 1+lg.clubs.filter((c,i)=>i!==myClub().c&&club(myClub().l+'-'+i).s>me).length}
function mgrNewSeason(){

}
function mgrPlayMatch(f){
  const m=M(),c=myClub(),o=team(f.opp),comp=compOf(f),ko=f.k==='K';
  let sA=mgrStrength()+(m.morale-50)/22-m.fatigue/22+(m.rep-40)/40-(m.inj>0?3:0)-(m.rotate?1.5:0);
  const sB=o.s+D().ko*(ko?1:.6)+(rivalAt(f.opp)?2:0);
  const neutral=ko&&comp&&f.stage===comp.stages.length-1;
  let la=1.3*Math.exp((sA-sB)/15)*(neutral?1:f.home?1.12:.92),lb=1.3*Math.exp((sB-sA)/15)*(neutral?1:f.home?.92:1.12);
  const t=m.tactic,stronger=sB>sA;
  if(t==='attacking'){la*=1.2;lb*=1.15}else if(t==='defensive'){la*=.82;lb*=.75}
  else if(t==='counter'){if(stronger){la*=1.06;lb*=.86}else{la*=.9;lb*=1}}
  else if(t==='possession'){if(!stronger){la*=1.14;lb*=.9}else{la*=.94;lb*=1.08}}
  else if(t==='press'){la*=1.1;lb*=.9}
  const gA=poisson(la),gB=poisson(lb);
  let pens=null,pensScore=null;
  if(ko&&gA===gB){const w=Math.random()<clamp(.5+(sA-sB)/60,.25,.75);pens=w?'W':'L';const a=RI(3,5),b=w?Math.max(1,a-RI(1,2)):a+RI(1,2);pensScore=w?[Math.max(a,b),Math.min(a,b)]:[Math.min(a,b),Math.max(a,b)]}
  const outcome=gA>gB?'W':gA<gB?'L':pens||'D';
  m.fatigue=clamp(m.fatigue+(m.rotate?-9:2.5)+(t==='press'?3.5:0),0,100);
  if(m.inj>0)m.inj--;else if(m.fatigue>60&&Math.random()<(m.fatigue-55)/120){m.inj=RI(2,4);news(`Injury crisis at ${c.n}: three players out.`)}
  const sc=ADJ_SCALE[S.diff]||1.6;
  const exp=(sA-sB)/6;
  m.board=clamp(m.board+((outcome==='W'?2.5:outcome==='L'?-3:0)-(outcome==='L'?Math.max(0,exp):0)+(outcome==='W'?Math.max(0,-exp):0))*sc*(ko?1.3:1),0,100);
  m.morale=clamp(m.morale+(outcome==='W'?4:outcome==='L'?-4:0)+(55-m.morale)*.12,0,100);
  m.rec[outcome==='W'?'w':outcome==='L'?'l':'d']++;
  const res={t:f.t,c:f.c,k:f.k,comp:compLabel(f),stage:stageLabel(f),our:c.id,opp:o.id,home:f.home,neutral,gA,gB,pens,pensScore,outcome,min:0,g:0,a:0,sh:0,sot:0,kp:0,dr:0,tk:0,ic:0,sv:0,pa:0,pc:0,r:null,mgr:true,tactic:TACTICS[t].n};
  res.ev=genEvents(res,c,o);res.ev.unshift({m:0,s:'us',k:'sub',t:`Kick-off. You set up with ${TACTICS[t].n.toLowerCase()}${m.rotate?' and a rotated XI':''}.`});
  res.text=outcome==='W'?pick(['Your plan worked to perfection.','A deserved win. The board is pleased.','The tactics paid off.']):outcome==='L'?pick(['The fans whistle at full time.','Your tactics were found out.','A painful defeat. Questions will be asked.']):pick(['A hard-earned point.','Stalemate. Neither side could break through.']);
  if(pens)res.text+=pens==='W'?' Through on penalties.':' Out on penalties.';
  return res;
}
function mgrPlayWeek(){
  const se=S.season,f=curFixture();
  if(!f)return mgrToEnd();
  const res=mgrPlayMatch(f);
  if(f.t==='L'){simRound(f.r,res);M().month.push(res.outcome);if(M().month.length>=4){if(M().month.every(x=>x==='W')){M().potm++;news(`${P().name} named ${LEAGUES[se.l].name} Manager of the Month.`)}M().month=[]}}
  else progress(f,res);
  P().money+=S.contract.wage;
  se.week++;se.last=res;se.log.unshift(res);if(se.log.length>45)se.log.pop();
  const imp=res.pens||res.rival||f.t==='L'&&f.r===se.rounds.length-1||(f.k==='K'&&compOf(f).stages.length-f.stage<=2);
  skipDead();
  if(M().board<=8&&se.week>8){mgrSack();return 'sacked'}
  if(se.week>=se.fixtures.length){
    if(!se.summerDone){se.summerDone=true;const t=setupSummer();if(t){S.notice=t;if(imp)S.teaser=true;return 'summer'}}
    if(imp){S.teaser=true;S.after='mgrend';return 'teaser'}
    return mgrToEnd();
  }
  if(imp){S.teaser=true;return 'teaser'}
  if(Math.random()<.3){S.event=pick(Object.keys(MEVENTS).filter(k=>!MEVENTS[k].w||MEVENTS[k].w()));return 'event'}
  return 'ok';
}
function mgrSack(){
  const m=M(),c=myClub();
  m.sacked++;m.rep=clamp(m.rep-10,0,100);
  m.seasons.push({y:S.year,club:c.n,k1:c.k1,pos:null,w:0,sacked:true,tr:[]});
  news(`${P().name} sacked by ${c.n}.`);
  S.flash2=`Sacked by ${c.n}. The board lost patience.`;
  P().age++;S.mgrAdvance=true;
  genMgrJobs(false);S.phase='mgrJobs';
}
function mgrToEnd(){mgrEndSeason();return 'end'}
function onMgrPlay(){S.simming=false;mgrAfter(mgrPlayWeek())}
function onMgrSim(){S.simming=true;let r,n=0;do{r=mgrPlayWeek();n++}while(r==='ok'&&n<60);if(r==='end'||r==='sacked')S.simming=false;save();render();if(r==='end'||r==='sacked')window.scrollTo({top:0})}
function mgrAfter(r){save();render();if(r==='end'||r==='sacked')window.scrollTo({top:0})}
function mgrEndSeason(){
  const se=S.season,m=M(),c=myClub(),lg=LEAGUES[se.l];
  const tbl=sortTable(se.table),pos=tbl.findIndex(t=>t.i===c.c)+1;
  if(pos===1)addTrophy(lg.name,{sub:c.n});
  const tr=(se.won||[]).slice(),aw=[];
  const diff=m.exp-pos;
  if(pos===1||diff>=3)aw.push(`${lg.name} Manager of the Season`);
  const endY=se.year+1;
  if(tr.some(t=>MAJOR.includes(t))||(pos===1&&tr.length>=2&&club(S.clubId).s>=80)){if(endY>=2016)aw.push('The Best FIFA Coach');else if(endY>=2010)aw.push('FIFA World Coach of the Year');else aw.push('World Coach of the Year')}
  specCeremony(se.year);
  aw.forEach(a=>{S.awards.push({n:a,y:seasonLabel(se.year),mgr:true});if(!/Manager of the Season/.test(a))celebrate(a,'Manager award');news(`${P().name} wins ${a}.`)});
  if(S.pendCer){S.cele.push(ceremonyItem(se.year,S.pendCer.lg,S.pendCer.gl,aw.filter(a=>/Manager of the Season/.test(a))));S.pendCer=null}
  m.board=clamp(m.board+diff*6*(ADJ_SCALE[S.diff]||1.6)/1.6+tr.length*8,0,100);
  m.rep=clamp(m.rep+diff*2+tr.length*4+aw.length*3,0,100);
  m.seasons.push({y:se.year,club:c.n,k1:c.k1,pos,exp:m.exp,tr:tr,w:se.log.filter(x=>x.outcome==='W').length,d:se.log.filter(x=>x.outcome==='D').length,l:se.log.filter(x=>x.outcome==='L').length});
  const cq=lg.coef>=2?4:2;
  S.contClub=pos<=cq?S.clubId:null;
  S.cont2Club=(pos>cq&&pos<=cq+2)||(S.flags.cupWon&&pos>cq)?S.clubId:null;
  S.superClub=(pos===1||S.flags.cupWon)?S.clubId:null;S.cont2Cup=!!(S.flags.cupWon&&pos>cq);S.flags.cupWon=false;
  m.build=clamp(m.build*.6,-4,5);m.fatigue=10;m.inj=0;
  S.contract.years--;P().age++;ageStars();
  S.msummary={year:se.year,pos,exp:m.exp,obj:m.obj,tr,aw,board:m.board};
  S.phase='mgrEnd';publishCareer();
}
function mgrWindowChoices(){

function mgrDecide(k){

function mgrContinue(stay){

  code=(code||'').trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(code))return 'Party codes are 5 letters or numbers.';
  try{
    const pd=await DB.doc('parties/'+code).get();if(!pd.exists)return 'No party with that code. Check it with your friend.';
    const p=pd.data(),ms=await DB.collection(`parties/${code}/members`).limit(20).get();
    const live=ms.docs.filter(d=>d.exists&&!d.data().left);
    if(live.length>=8&&!live.some(d=>d.id===UID))return 'That party is full (8 players).';
    const year=live.reduce((y,d)=>Math.max(y,+d.data().readyYear||0),+p.era||2026);
    draft.pj={code,era:+p.era,diff:DIFF[p.diff]?p.diff:'hard',year};draft.diff=draft.pj.diff;draft.era=year;rerollAcademy();return null;
  }catch(e){return 'Couldn\'t reach that party. Try again.'}
}

function crowdCanvas(box,gold){
  const cv=document.createElement('canvas');cv.className='crowd';box.prepend(cv);
  const W=cv.width=box.clientWidth||600,H=cv.height=box.clientHeight||500,ctx=cv.getContext('2d');
  if(!ctx)return;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dots=Array.from({length:520},()=>({x:Math.random()*W,y:H*.42+Math.random()*H*.5,r:R(1,2.4),p:Math.random()*6}));
  let t=0;const draw=()=>{
    ctx.clearRect(0,0,W,H);
    dots.forEach(d=>{const a=.18+.22*Math.sin(t/14+d.p);ctx.fillStyle=`rgba(238,241,228,${a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.3);ctx.fill()});
    if(!reduce&&t>30)for(let i=0;i<(gold?5:3);i++)if(Math.random()<.35){const x=Math.random()*W,y=H*.4+Math.random()*H*.5;const g=ctx.createRadialGradient(x,y,0,x,y,14);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(x-14,y-14,28,28)}
    t++;if(!reduce&&cv.isConnected&&t<1400)requestAnimationFrame(draw)};draw();
}

const EU_EXTRA=['Galatasaray','Fenerbahçe','Dynamo Kyiv','Olympiacos','Celtic','Basel','RB Salzburg','Dinamo Zagreb','Malmö','Mallorca','Las Palmas','Birmingham City','West Ham','Brescia','Perugia','Bellmare Hiratsuka'].filter(x=>x!=='Bellmare Hiratsuka');
const EU_NATS=['Belgium','Croatia','Denmark','England','France','Germany','Italy','Netherlands','Norway','Poland','Portugal','Serbia','Spain','Switzerland','Turkey','Bulgaria','Czech Republic','Ukraine','Sweden','Wales','Romania','Scotland','Ireland'];
function euClub(cn){const e=eraFor(S?S.year:2026);return EU_EXTRA.includes(cn)||LEAGUES.some((l,li)=>l.conf==='EU'&&!l.youth&&clubsFor(e,li).some(c=>c.n===cn))}
function bdEligibleStar(s,endY){if(endY>=2007)return true;if(endY<1995)return EU_NATS.includes(s.nat);return euClub(s.cn)}
const LG_KINDS=[['ypots','Young Player of the Season'],['glove','Golden Glove'],['boot','Golden Boot'],['pots','Player of the Season']];
const GL_KINDS=['talent','gboy','kopa','yashin','best','bd'];
function glName(k,endY){return k==='bd'?ballonName(endY):k==='best'?fifaBestName(endY):k==='kopa'?'Kopa Trophy':k==='gboy'?'Golden Boy':k==='talent'?'Talent of the Year':'Yashin Trophy'}
function glHeld(k,endY){return k==='bd'||k==='talent'||(k==='best'&&!!fifaBestName(endY))||(k==='kopa'&&endY>=2018)||(k==='gboy'&&endY>=2003)||(k==='yashin'&&endY>=2019)}

/* --- solo global votes: every award held, you are included only where eligible --- */
function vrank(pool,noise,me,bonus){
  const rows=pool.map(s=>({n:s.n,nat:s.nat,club:s.cn||'',regen:!!s.regen,pos:s.pos,o:s.o,score:s.o+POS[s.pos].adj+n01()*noise+(s.o>=88?R(0,2.5):0)}));
  if(me)rows.push({n:me.n,nat:me.nat,club:me.club,me:true,hl:S.meHl||null,score:me.score+bonus+n01()*.6});
  rows.sort((a,b)=>b.score-a.score);const r=rows.findIndex(x=>x.me)+1;return {rank:r||99,top:rows.slice(0,10)};
}
function soloVoteAll(sc,endY,eligible,eu,p,clubName){
  const votes={},aw=[],me={n:p.name,nat:p.nation,club:clubName,score:sc},young=p.age<=21;
  const adults=starPool().filter(s=>s.age>=18),yp=youthPool();
  votes.bd=vrank(adults.filter(s=>bdEligibleStar(s,endY)),2.4,eligible?me:null,0);if(!eligible)votes.bd.out='Not eligible this year';
  if(glHeld('best',endY))votes.best=vrank(adults,2.8,me,0);
  if(glHeld('kopa',endY))votes.kopa=vrank(yp,2.2,young?me:null,4);
  if(glHeld('gboy',endY))votes.gboy=vrank(yp.filter(s=>euClub(s.cn)),2.6,young&&eu?me:null,4);
  votes.talent=vrank(yp,3,young?me:null,4);
  if(glHeld('yashin',endY))votes.yashin=vrank(adults.filter(s=>s.pos==='GK'),2,p.pos==='GK'?me:null,2);
  GL_KINDS.forEach(k=>{const v=votes[k];if(v&&v.rank===1)aw.push(glName(k,endY))});
  if(votes.bd.rank===1){S.bdBest=1;news(`${p.name} wins the ${ballonName(endY)} ${endY}!`)}else if(eligible&&votes.bd.rank<=30&&(!S.bdBest||votes.bd.rank<S.bdBest))S.bdBest=votes.bd.rank;
  return {votes,aw};
}

/* --- league awards: real players at clubs in your league, then fictional fill --- */
function leagueStars(endY,l,rng){
  const names=LEAGUES[l].clubs.map(c=>c.n);
  const real=realStars(endY).filter(s=>names.includes(s.cn));
  const out=real.slice();
  for(let i=0;out.length<8;i++){const r1=rng(),age=19+Math.floor(rng()*13);out.push({n:FIRST[Math.floor(rng()*FIRST.length)]+' '+LAST[Math.floor(rng()*LAST.length)],nat:NATIONS[Math.floor(rng()*NATIONS.length)][0],pos:r1<.45?'FWD':r1<.8?'MID':'DEF',age,o:68+Math.floor(rng()*9),cn:names[Math.floor(rng()*names.length)],regen:true})}
  const young=out.filter(s=>s.age<=21);
  for(let i=0;young.length<3;i++){const s={n:FIRST[Math.floor(rng()*FIRST.length)]+' '+LAST[Math.floor(rng()*LAST.length)],nat:NATIONS[Math.floor(rng()*NATIONS.length)][0],pos:'MID',age:18+Math.floor(rng()*4),o:62+Math.floor(rng()*8),cn:names[Math.floor(rng()*names.length)],regen:true};young.push(s)}
  const gk=out.filter(s=>s.pos==='GK');
  for(let i=0;gk.length<3;i++)gk.push({n:FIRST[Math.floor(rng()*FIRST.length)]+' '+LAST[Math.floor(rng()*LAST.length)],nat:NATIONS[Math.floor(rng()*NATIONS.length)][0],pos:'GK',age:22+Math.floor(rng()*12),o:68+Math.floor(rng()*9),cn:names[Math.floor(rng()*names.length)],regen:true});
  return {all:out.sort((a,b)=>b.o-a.o),young:young.sort((a,b)=>b.o-a.o),gk:gk.sort((a,b)=>b.o-a.o)};
}
/* humans: [{n,nat,club,me,friend,goals,avg,apps,age}] in this league. Returns ceremony entries + the names you won. */
function leagueAwardsFor(endY,l,lgName,humans,rng,bench){
  const pool=leagueStars(endY,l,rng),out=[],wonByMe=[];
  const bootTop=bench.top,potsBar=bench.pots,ypBar=bench.ypots;
  LG_KINDS.forEach(([k,label])=>{
    const name=`${lgName} ${label}`;
    const val=h=>k==='boot'?h.goals:k==='glove'?(+h.cs||0):h.avg;
    const qual=h=>k==='glove'?h.pos==='GK'&&(+h.cs||0)>=bench.cs:k==='boot'?h.goals>0&&h.goals>=bootTop:k==='pots'?h.apps>=16&&h.avg>=potsBar:h.age<=21&&h.apps>=12&&h.avg>=ypBar;
    const near=h=>k==='glove'?h.pos==='GK'&&(+h.cs||0)>=bench.cs-4:k==='boot'?h.goals>=bootTop-6&&h.goals>0:k==='pots'?h.apps>=14&&h.avg>=potsBar-.45:h.age<=21&&h.apps>=10&&h.avg>=ypBar-.45;
    const fmt=v=>k==='glove'?`${v} clean sheets`:k==='boot'?`${v} goals`:`Avg rating ${(+v).toFixed(2)}`;
    const hum=humans.filter(near).sort((a,b)=>val(b)-val(a));
    const hw=humans.filter(qual).sort((a,b)=>val(b)-val(a))[0]||null;
    const ai=(k==='glove'?pool.gk:k==='ypots'?pool.young:k==='boot'?pool.all.slice().sort((a,b)=>(b.pos==='FWD')-(a.pos==='FWD')||b.o-a.o):pool.all).slice(0,3);
    const aiVal=i=>k==='glove'?Math.max(3,(hw?val(hw)-1-Math.floor(rng()*2)-i:bench.cs-i*(1+Math.floor(rng()*2)))):k==='boot'?Math.max(1,(hw?val(hw)-1-Math.floor(rng()*3)-i:bootTop-i*(1+Math.floor(rng()*2)))):+(hw?val(hw)-.05-rng()*.15-i*.08:(k==='pots'?potsBar:ypBar)+.12-i*.09-rng()*.05).toFixed(2);
    const aiN=ai.map((s,i)=>({n:s.n,nat:s.nat,club:s.cn,fict:!!s.regen,pos:s.pos,o:s.o,v:aiVal(i)}));
    let noms;
    const cap=Math.min(5,Math.max(3,hum.length+1));
    if(hw){noms=[{...hw,v:val(hw)}].concat(hum.filter(h=>h!==hw).map(h=>({...h,v:val(h)}))).concat(aiN).slice(0,cap)}
    else{noms=[aiN[0]].concat(hum.map(h=>({...h,v:val(h)}))).concat(aiN.slice(1)).slice(0,cap)}
    noms.forEach(x=>{x.stat=fmt(x.v);x.hl=[x.stat].concat(((x.me||x.friend)&&x.hl?x.hl:aiHighlights(x,endY,x===noms[0],true)).filter(h=>k==='boot'?!/ goals$/.test(h):k==='glove'?!/clean sheets$/.test(h):!/^Avg /.test(h)).slice(0,3))});
    const winner=noms[0];
    if(winner.me)wonByMe.push(name);
    out.push({key:k,n:name,noms,winner});
  });
  return {list:out,won:wonByMe};
}
function globalEntries(votes,endY,meName){
  const out=[];
  GL_KINDS.forEach(k=>{const v=votes[k];if(!v||!v.top||!v.top.length||!glHeld(k,endY))return;

const FORMS={'4-3-3':[1,4,3,3],'4-4-2':[1,4,4,2],'4-2-3-1':[1,4,5,1],'3-5-2':[1,3,5,2],'5-3-2':[1,5,3,2],'3-4-3':[1,3,4,3]};
const FORM_D={'4-3-3':'Balanced attack','4-4-2':'Classic and solid','4-2-3-1':'Midfield control','3-5-2':'Packed midfield','5-3-2':'Hard to break down','3-4-3':'All-out width'};
const TRAIN={balanced:{n:'Balanced',d:'Steady growth'},fitness:{n:'Fitness',d:'Faster recovery between games'},attack:{n:'Attacking',d:'Sharper in front of goal'},defence:{n:'Defending',d:'Tighter at the back'},youth:{n:'Youth focus',d:'Under-23s develop faster'}};
const FAC={train:{n:'Training ground',d:'Players develop faster'},youth:{n:'Youth academy',d:'Better academy prospects'},scout:{n:'Scouting network',d:'More and better transfer targets'}};
const PORD={GK:0,DEF:1,MID:2,FWD:3};
let mview='match',mkFilter='ALL',mkSort='o';

/* ---------- players ---------- */
function pValue(o,age){const af=age<20?2:age<22?1.7:age<25?1.4:age<29?1.1:age<32?.7:.35;return Math.round(Math.pow(1.2,o-50)*50000*af)}
function pWage(o,s){return Math.max(250,Math.round(wageFor(o,s)))}
let _pidN=0;
function mkP(o){
  const oo=Math.round((+o.o||50)*10)/10;
  return {id:'p'+(Date.now()%1e8).toString(36)+(_pidN++).toString(36)+Math.floor(Math.random()*1e4).toString(36),n:o.n,nat:o.nat,pos:o.pos,age:o.age,o:oo,pot:Math.round(Math.max(+o.pot||oo,oo)*10)/10,
    real:!!o.real,fit:100,inj:0,apps:0,g:0,a:0,rs:0,wage:o.wage||0,yrs:o.yrs||RI(1,4),drop:false,joined:S?S.year:0};
}
function fakeName(){return pick(FIRST)+' '+pick(LAST)}
function natFor(l){const c=LEAGUES[l]&&LEAGUES[l].country,n=NATIONS.find(x=>x[0]===c);return n&&Math.random()<.6?n[0]:pick(NATIONS)[0]}
function clubByName(n){const id=allPro().find(i=>club(i).n===n);return id?club(id):null}
function genSquad(id){
  const c=club(id),s=c.s,out=[];
  const real=realStars(S.year+1).filter(p=>p.cn===c.n);
  const regens=(S.stars||[]).filter(x=>x.club===id).map(x=>({...x,regen:true}));
  real.concat(regens).forEach(p=>out.push(mkP({...p,pot:p.o+(p.age<24?R(1,6):0),wage:pWage(p.o,s),yrs:RI(1,4)})));
  const want={GK:3,DEF:8,MID:8,FWD:5},start={GK:1,DEF:4,MID:3,FWD:3};
  Object.keys(want).forEach(pos=>{
    let have=out.filter(p=>p.pos===pos).length;
    while(have<want[pos]){
      const starter=have<start[pos],age=starter?RI(22,31):RI(18,33);
      const o=clamp(starter?s+R(-2,3):s-R(4,10),35,92);
      out.push(mkP({n:fakeName(),nat:natFor(c.l),pos,age,o,pot:o+(age<=21?R(3,14):age<=24?R(0,5):0),wage:pWage(o,s),yrs:RI(1,4)}));have++;
    }
  });
  return out;
}
function sq(){
  const m=M();
  if(!m.squad||m.squadClub!==S.clubId){
    m.squad=genSquad(S.clubId);m.squadClub=S.clubId;
    m.wageBudget=Math.round(m.squad.reduce((a,p)=>a+p.wage,0)*1.18);
    m.academy=[];m.market=null;m.offers=null;m.bid=null;m.msg='';
  }
  m.form=m.form||'4-3-3';m.train=m.train||'balanced';m.fac=m.fac||{train:1,youth:1,scout:1};m.academy=m.academy||[];
  if(!m.wageBudget)m.wageBudget=Math.round(m.squad.reduce((a,p)=>a+p.wage,0)*1.12);
  return m.squad;
}
const wageBill=()=>sq().reduce((a,p)=>a+p.wage,0);
const effO=p=>p.o-(100-p.fit)*.08;
function pickXI(){
  const m=M(),f=FORMS[m.form]||FORMS['4-3-3'],need={GK:f[0],DEF:f[1],MID:f[2],FWD:f[3]};
  const all=sq().filter(p=>!p.inj);
  const avail=all.filter(p=>!p.drop&&!(m.rotate&&p.fit<78));
  const xi=[],used=new Set();
  ['GK','DEF','MID','FWD'].forEach(pos=>avail.filter(p=>p.pos===pos).sort((a,b)=>effO(b)-effO(a)).slice(0,need[pos]).forEach(p=>{xi.push({p,pos,oop:false});used.add(p.id)}));
  ['GK','DEF','MID','FWD'].forEach(pos=>{
    let have=xi.filter(x=>x.pos===pos).length;
    while(have<need[pos]){
      const cand=avail.filter(p=>!used.has(p.id)).sort((a,b)=>effO(b)-effO(a))[0]||all.filter(p=>!used.has(p.id)).sort((a,b)=>effO(b)-effO(a))[0];
      if(!cand)break;xi.push({p:cand,pos,oop:cand.pos!==pos});used.add(cand.id);have++;
    }
  });
  return xi.sort((a,b)=>PORD[a.pos]-PORD[b.pos]);
}
function xiStrength(xi){
  const v=xi.map(x=>effO(x.p)-(x.oop?(x.pos==='GK'||x.p.pos==='GK'?22:6):0));
  return (v.reduce((a,b)=>a+b,0)+Math.max(0,11-xi.length)*35)/11;
}
mgrStrength=function(){if(!S.mgr||!S.mgr.active)return myClub().s;return xiStrength(pickXI())+clamp(M().build||0,-4,4)*.5};

/* the transfer window: pre-season (first 3 matchdays) and January (middle of the season) */
function janStart(){const n=S.season?S.season.fixtures.length:40;return Math.floor(n*.5)}
function windowState(){
  if(!S.season||S.phase!=='mgrHub')return {open:false,label:'Closed'};
  const w=S.season.week,j=janStart();
  if(w<3)return {open:true,key:'pre'+S.year,label:`Summer window · closes in ${3-w} match${3-w===1?'':'es'}`};
  if(w>=j&&w<j+3)return {open:true,key:'jan'+S.year,label:`January window · closes in ${j+3-w} match${j+3-w===1?'':'es'}`};
  return {open:false,label:w<j?`Closed · January window opens in ${j-w} matches`:'Closed until next summer'};
}

/* ---------- match engine with your real XI ---------- */
mgrPlayMatch=function(f){
  const m=M(),c=myClub(),o=team(f.opp),comp=compOf(f),ko=f.k==='K';sq();
  const xi=pickXI();
  let sA=xiStrength(xi)+clamp(m.build||0,-4,4)*.5+(m.morale-50)/22+(m.rep-40)/40;
  const sB=o.s+D().ko*(ko?1:.6)+(rivalAt(f.opp)?2:0);
  const neutral=ko&&comp&&f.stage===comp.stages.length-1;
  let la=1.3*Math.exp((sA-sB)/15)*(neutral?1:f.home?1.12:.92),lb=1.3*Math.exp((sB-sA)/15)*(neutral?1:f.home?.92:1.12);
  const t=m.tactic,stronger=sB>sA;
  if(t==='attacking'){la*=1.2;lb*=1.15}else if(t==='defensive'){la*=.82;lb*=.75}
  else if(t==='counter'){if(stronger){la*=1.06;lb*=.86}else{la*=.9}}
  else if(t==='possession'){if(!stronger){la*=1.14;lb*=.9}else{la*=.94;lb*=1.08}}
  else if(t==='press'){la*=1.1;lb*=.9}
  const F=FORMS[m.form]||FORMS['4-3-3'];
  la*=1+(F[3]-2)*.05+(F[2]-3)*.015;lb*=1-(F[1]-4)*.06+(F[3]-2)*.035;
  if(m.train==='attack')la*=1.04;if(m.train==='defence')lb*=.95;
  const gA=poisson(la),gB=poisson(lb);
  let pens=null,pensScore=null;
  if(ko&&gA===gB){const w=Math.random()<clamp(.5+(sA-sB)/60,.25,.75);pens=w?'W':'L';const a=RI(3,5),b=w?Math.max(1,a-RI(1,2)):a+RI(1,2);pensScore=w?[Math.max(a,b),Math.min(a,b)]:[Math.min(a,b),Math.max(a,b)]}
  const outcome=gA>gB?'W':gA<gB?'L':pens||'D';
  // who scored, who assisted
  const wG=x=>x.pos==='FWD'?5:x.pos==='MID'?2.2:x.pos==='DEF'?.5:0,wA=x=>x.pos==='FWD'?2.5:x.pos==='MID'?3.5:x.pos==='DEF'?1:.05;
  const pickW=(list,w,not)=>{const l=list.filter(x=>x!==not);const tot=l.reduce((a,x)=>a+w(x)*Math.max(.3,(x.p.o-50)/30),0);let r=Math.random()*tot;for(const x of l){r-=w(x)*Math.max(.3,(x.p.o-50)/30);if(r<=0)return x}return l[0]};
  const scorers=[];
  for(let i=0;i<gA&&xi.length;i++){const s=pickW(xi,wG);s.p.g++;let a=null;if(Math.random()<.75){a=pickW(xi,wA,s);if(a)a.p.a++}scorers.push(a?`${s.p.n} scores, assisted by ${a.p.n}`:`${s.p.n} scores`)}
  // fitness, ratings, injuries
  const ids=new Set(xi.map(x=>x.p.id));
  xi.forEach(x=>{x.p.apps++;x.p.rs=Math.round((x.p.rs+clamp(6.4+(outcome==='W'?.5:outcome==='L'?-.45:0)+(x.p.o-sB)/25+R(-.6,.6),4.5,9.8))*100)/100});
  scorers.forEach(()=>{});
  sq().forEach(p=>{
    if(p.inj>0){p.inj--;return}
    if(ids.has(p.id))p.fit=clamp(p.fit-RI(6,10)-(t==='press'?4:0),25,100);
    p.fit=clamp(p.fit+(100-p.fit)*(.36+(m.train==='fitness'?.12:0)+m.fac.train*.02),0,100);
  });
  xi.forEach(x=>{if(Math.random()<.011*(1+(100-x.p.fit)/25)*(D().inj||1)*(t==='press'?1.3:1)){x.p.inj=RI(1,7);news(`${x.p.n} picks up an injury and is out for ${x.p.inj} week${x.p.inj===1?'':'s'}.`)}});
  const xs=xi.map(x=>x.p.fit);m.fatigue=Math.round(100-(xs.reduce((a,b)=>a+b,0)/Math.max(1,xs.length)));m.inj=sq().filter(p=>p.inj>0).length;
  const sc=ADJ_SCALE[S.diff]||1.6,exp=(sA-sB)/6;
  m.board=clamp(m.board+((outcome==='W'?2.5:outcome==='L'?-3:0)-(outcome==='L'?Math.max(0,exp):0)+(outcome==='W'?Math.max(0,-exp):0))*sc*(ko?1.3:1),0,100);
  m.morale=clamp(m.morale+(outcome==='W'?4:outcome==='L'?-4:0)+(55-m.morale)*.12,0,100);
  m.rec[outcome==='W'?'w':outcome==='L'?'l':'d']++;
  const res={t:f.t,c:f.c,k:f.k,comp:compLabel(f),stage:stageLabel(f),our:c.id,opp:o.id,home:f.home,neutral,gA,gB,pens,pensScore,outcome,min:0,g:0,a:0,sh:0,sot:0,kp:0,dr:0,tk:0,ic:0,sv:0,pa:0,pc:0,r:null,mgr:true,tactic:`${m.form} · ${TACTICS[t].n}`};
  res.ev=genEvents(res,c,o);let si=0;res.ev.filter(e=>e.s==='us'&&e.k==='goal'&&e.m<120).sort((a,b)=>a.m-b.m).forEach(e=>{if(scorers[si])e.t=scorers[si++]});
  res.ev.unshift({m:0,s:'us',k:'sub',t:`Kick-off. ${m.form}, ${TACTICS[t].n.toLowerCase()}. ${xi.filter(x=>x.pos==='FWD').map(x=>x.p.n).join(', ')||'No striker'} up front.`});
  res.scorers=scorers.map(s=>s.replace(/ scores.*/,''));
  res.text=(outcome==='W'?pick(['Your plan worked to perfection.','A deserved win. The board is pleased.','The tactics paid off.']):outcome==='L'?pick(['The fans whistle at full time.','Your tactics were found out.','A painful defeat. Questions will be asked.']):pick(['A hard-earned point.','Stalemate. Neither side could break through.']))+(res.scorers.length?` Scorers: ${res.scorers.join(', ')}.`:'');
  if(pens)res.text+=pens==='W'?' Through on penalties.':' Out on penalties.';
  return res;
};

/* ---------- windows: market, incoming bids ---------- */
function genMarket(){
  const m=M(),me=xiStrength(pickXI()),myS=myClub().s,sc=m.fac.scout,mine=myClub().n;
  const have=new Set(sq().map(p=>p.n));
  const pool=starPool().filter(p=>p.cn&&p.cn!==mine&&!have.has(p.n)&&p.age>=17&&p.age<=35&&p.o>=me-12&&p.o<=me+7+sc);
  const real=shuffle(pool).slice(0,8+sc*3);
  const pro=allPro().filter(id=>club(id).n!==mine);
  const fict=[];
  for(let i=0;i<12+sc*3;i++){
    const r=Math.random(),pos=r<.1?'GK':r<.4?'DEF':r<.72?'MID':'FWD',age=RI(17,32),gem=Math.random()<.04*sc;
    const o=clamp(me+R(-11,3)+sc*.5+(gem?R(2,5):0),40,92),c=club(pick(pro));
    fict.push({n:fakeName(),nat:natFor(c.l),pos,age,o,pot:o+(age<=21?R(2,12)+(gem?R(5,10):0):age<=24?R(0,4):0),cn:c.n});
  }
  const free=[];for(let i=0;i<2;i++){const r=Math.random(),pos=r<.15?'GK':r<.45?'DEF':r<.75?'MID':'FWD',age=RI(29,34),o=clamp(me+R(-6,1),40,90);free.push({n:fakeName(),nat:pick(NATIONS)[0],pos,age,o,pot:o,cn:'Free agent',free:true})}
  m.market=real.concat(fict,free).map(p=>{
    const sc2=p.free?60:((clubByName(p.cn)||{s:72}).s);
    const ask=p.free?0:Math.round(pValue(p.o,p.age)*R(1.05,1.35)*(sc2>myS?1.12:1));
    const est=sc>=4?Math.round(p.pot):null;
    return {n:p.n,nat:p.nat,pos:p.pos,age:p.age,o:Math.round(p.o*10)/10,pot:p.pot,real:!!p.real&&!p.regen,club:p.cn,clubS:sc2,ask,wageAsk:Math.round(pWage(p.o,myS)*R(1,1.25)*(p.free?1.5:1)),free:!!p.free,est,done:false};
  });
  m.marketKey=windowState().key;m.msg='';
  // a rival club might bid for one of your best players
  if(Math.random()<.4){const best=sq().filter(p=>!p.inj).sort((a,b)=>b.o-a.o).slice(0,4);const p=pick(best);if(p){const buyer=club(pick(allPro().filter(id=>club(id).s>=myS-2&&club(id).n!==mine)));if(buyer)m.bid={pid:p.id,club:buyer.n,fee:Math.round(pValue(p.o,p.age)*R(.9,1.45))}}}
}
function ensureMarket(){const w=windowState();if(w.open&&M().marketKey!==w.key)genMarket();return w}
function mMsg(t){M().msg=t;save();renderMgrHub()}
function mBid(i,mult){
  const m=M(),L=m.market&&m.market[i];if(!L||L.done)return;
  if(!windowState().open)return mMsg('The transfer window is closed.');
  const fee=Math.round(L.ask*mult),wage=L.wageAsk;
  if(fee>m.budget)return mMsg(`Not enough transfer budget. You have ${money(m.budget)}.`);
  if(wageBill()+wage>m.wageBudget)return mMsg(`That breaks your wage budget (${money(wageBill())} of ${money(m.wageBudget)} a week). Sell or release someone first.`);
  if(sq().length>=30)return mMsg('Your squad is full (30). Sell or release someone first.');
  const me=xiStrength(pickXI()),myS=myClub().s;
  let pClub=L.free?1:mult>=1.15?.97:mult>=1?.86:mult>=.85?.5:.18;if(L.clubS>myS+4&&!L.free)pClub*=.65;
  let pPl=clamp(.72+(myS+m.rep/12-L.clubS)*.035,.12,.97);if(L.o>me+4)pPl*=.75;if(S.contClub===S.clubId)pPl=Math.min(.98,pPl+.1);
  L.done=true;
  if(Math.random()>pClub){news(`${L.club} reject a ${money(fee)} bid from ${myClub().n} for ${L.n}.`);return mMsg(`${L.club} rejected your ${money(fee)} bid for ${L.n}.`)}
  if(Math.random()>pPl)return mMsg(`${L.free?'':L.club+' accepted, but '}${L.n} turned down the move to ${myClub().n}.`);
  m.budget-=fee;
  const p=mkP({...L,wage,yrs:RI(2,5)});sq().push(p);
  if(L.real&&!inParty()){S.moves=S.moves||{};S.moves[L.n]=myClub().n}
  m.morale=clamp(m.morale+2,0,100);
  news(L.free?`${myClub().n} sign free agent ${L.n}.`:`${myClub().n} sign ${L.n} from ${L.club} for ${money(fee)}.`);
  mMsg(L.free?`Done deal! ${L.n} signs on a free.`:`Done deal! ${L.n} joins from ${L.club} for ${money(fee)}.`);
}
function canLose(p){const s=sq();if(s.length<=18)return 'You need at least 18 players.';if(p.pos==='GK'&&s.filter(x=>x.pos==='GK').length<=2)return 'You need at least 2 goalkeepers.';return ''}
function removeP(p,to){const m=M();m.squad=m.squad.filter(x=>x.id!==p.id);if(p.real&&!inParty()){S.moves=S.moves||{};S.moves[p.n]=to||club(pick(allPro())).n}}
function mSell(pid){
  const m=M(),p=sq().find(x=>x.id===pid);if(!p)return;
  if(!windowState().open)return mMsg('You can only sell while the transfer window is open.');
  const why=canLose(p);if(why)return mMsg(why);
  const mine=myClub().n,ids=shuffle(allPro().filter(id=>club(id).n!==mine)).sort((a,b)=>Math.abs(club(a).s-p.o)-Math.abs(club(b).s-p.o)).slice(0,10);
  const n=p.o>=60?RI(1,3):RI(0,2);
  m.offers={pid,list:shuffle(ids).slice(0,n).map(id=>({club:club(id).n,fee:Math.round(pValue(p.o,p.age)*R(.6,1.2))})).sort((a,b)=>b.fee-a.fee)};
  if(!m.offers.list.length){m.offers=null;return mMsg(`Nobody made an offer for ${p.n}.`)}
  m.msg='';mview='market';save();renderMgrHub();
}
function mAccept(j){
  const m=M(),o=m.offers,p=o&&sq().find(x=>x.id===o.pid),of=o&&o.list[j];if(!p||!of)return;
  const why=canLose(p);if(why){m.offers=null;return mMsg(why)}
  const top=sq().slice().sort((a,b)=>b.o-a.o).indexOf(p)<3;
  removeP(p,of.club);m.budget+=of.fee;m.offers=null;if(top){m.morale=clamp(m.morale-5,0,100);m.board=clamp(m.board+3,0,100)}
  news(`${p.n} leaves ${myClub().n} for ${of.club} in a ${money(of.fee)} deal.`);
  mMsg(`${p.n} sold to ${of.club} for ${money(of.fee)}.`);
}
function mBidReply(ok){
  const m=M(),b=m.bid,p=b&&sq().find(x=>x.id===b.pid);m.bid=null;if(!p)return mMsg('');
  if(ok){const why=canLose(p);if(why)return mMsg(why);removeP(p,b.club);m.budget+=b.fee;m.morale=clamp(m.morale-4,0,100);m.board=clamp(m.board+4,0,100);news(`${p.n} joins ${b.club} for ${money(b.fee)}.`);return mMsg(`You sold ${p.n} to ${b.club} for ${money(b.fee)}.`)}
  if(Math.random()<.35){m.morale=clamp(m.morale-6,0,100);news(`${p.n} is unhappy after ${myClub().n} block his move to ${b.club}.`);return mMsg(`You rejected the bid. ${p.n} is unhappy about it.`)}
  mMsg(`You rejected ${b.club}'s bid for ${p.n}.`);
}
function mRelease(pid){
  const m=M(),p=sq().find(x=>x.id===pid);if(!p)return;const why=canLose(p);if(why)return mMsg(why);
  const cost=Math.round(p.wage*26*Math.max(1,p.yrs));if(cost>m.budget)return mMsg(`Paying off ${p.n}'s contract costs ${money(cost)}. Not enough budget.`);
  m.budget-=cost;removeP(p);news(`${myClub().n} release ${p.n}.`);mMsg(`${p.n} released. Paid ${money(cost)} to end his contract.`);
}
function mRenew(pid){
  const m=M(),p=sq().find(x=>x.id===pid);if(!p||p.yrs>1)return;
  const wage=Math.round(pWage(p.o,myClub().s)*R(1.05,1.3));
  if(wageBill()-p.wage+wage>m.wageBudget)return mMsg(`${p.n} wants ${money(wage)}/wk. That breaks your wage budget.`);
  const xi=new Set(pickXI().map(x=>x.p.id)),ok=Math.random()<clamp(.55+(xi.has(p.id)?.25:-.1)+(m.morale-50)/150+(p.age>=31?.15:0),.15,.95);
  p.renewTried=S.year;
  if(!ok)return mMsg(`${p.n} rejected your contract offer. He leaves when his deal ends unless you sell him.`);
  p.wage=wage;p.yrs=p.age>=31?RI(1,2):RI(3,5);news(`${p.n} signs a new deal at ${myClub().n}.`);mMsg(`${p.n} signs a new ${p.yrs}-year deal at ${money(wage)}/wk.`);
}
function mUpgrade(k){
  const m=M();sq();const lv=m.fac[k];if(lv>=5)return;
  const cost=Math.round(budgetFor(myClub().s)*.12*lv+250000);if(cost>m.budget)return mMsg(`Upgrading costs ${money(cost)}. Not enough budget.`);
  m.budget-=cost;m.fac[k]++;m.board=clamp(m.board+1,0,100);news(`${myClub().n} upgrade their ${FAC[k].n.toLowerCase()}.`);mMsg(`${FAC[k].n} upgraded to level ${m.fac[k]}.`);
}
function youthIntake(){
  const m=M(),lv=m.fac.youth,n=RI(2,3),out=[];
  for(let i=0;i<n;i++){const r=Math.random(),pos=r<.1?'GK':r<.4?'DEF':r<.72?'MID':'FWD',o=clamp(myClub().s-R(14,24)+lv*2,35,80);
    out.push({n:fakeName(),nat:natFor(myClub().l),pos,age:RI(16,17),o:Math.round(o*10)/10,pot:Math.round(clamp(o+R(8,20)+lv*2.5+(Math.random()<.04*lv?R(6,12):0),40,95)*10)/10})}
  m.academy=out;

function mPromote(i,keep){
