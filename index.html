/* ---------- season rollover ---------- */
function devSquad(){
  const m=M(),tm=.75+m.fac.train*.1,gone=[];
  sq().forEach(p=>{
    p.age++;let d;
    const yb=m.train==='youth'&&p.age<=23?1.3:1;
    if(p.age<=21)d=R(1,4.5)*(p.pot-p.o)/12*tm*yb+R(-.5,1);
    else if(p.age<=24)d=R(.3,2.5)*(p.pot-p.o)/12*tm*yb+R(-.5,.8);
    else if(p.age<=29)d=R(-1,1.2);
    else if(p.age<=32)d=-R(.3,2);else d=-R(1,3.5);
    if(p.age<=23)d+=p.apps>=20?.8:p.apps<5?-.6:0;
    p.o=Math.round(clamp(p.o+d,30,95)*10)/10;p.pot=Math.max(p.pot,p.o);
    p.yrs--;p.fit=100;p.inj=0;p.apps=0;p.g=0;p.a=0;p.rs=0;p.drop=false;
  });
  m.squad=m.squad.filter(p=>{
    if(p.yrs<=0){gone.push(`${p.n} (contract ended)`);if(p.real&&!inParty()){S.moves=S.moves||{};S.moves[p.n]=club(pick(allPro())).n}return false}
    if(p.age>=38||(p.age>=35&&Math.random()<.35)){gone.push(`${p.n} (retired)`);return false}
    return true;
  });
  // the club tops the squad up with cheap fringe players if it gets too thin
  const need={GK:2,DEF:5,MID:5,FWD:3};
  Object.keys(need).forEach(pos=>{while(m.squad.filter(p=>p.pos===pos).length<need[pos]){const o=clamp(myClub().s-R(9,15),35,85);m.squad.push(mkP({n:fakeName(),nat:natFor(myClub().l),pos,age:RI(19,30),o,pot:o+R(0,4),wage:pWage(o,myClub().s),yrs:RI(1,2)}));gone.push(`(${pos} reinforcement signed by the club)`)}});
  return gone;
}

/* a real shootout sequence that ends with the right winner */
function pkSim(winUs){
  for(let t=0;t<800;t++){
    const order=Math.random()<.5?['us','them']:['them','us'],seq=[];let us=0,th=0,ku=0,kt=0,done=false,round=0;
    while(!done&&round<14){
      round++;

        const sc=Math.random()<.76;seq.push({side,sc});
        if(side==='us'){ku++;if(sc)us++}else{kt++;if(sc)th++}
        if(round<=5&&(us+(5-ku)<th||th+(5-kt)<us)){done=true;break}
      }
      if(!done&&round>=5&&ku===kt&&us!==th)done=true;
    }
    if(done&&(us>th)===winUs)return {seq,us,th};
  }
  return {seq:[{side:'us',sc:winUs},{side:'them',sc:!winUs}],us:winUs?1:0,th:winUs?0:1};
}

.pk-row i.ok{background:var(--win);color:#06200f}.pk-row i.miss{background:var(--red);color:#2b0800}
.podlift .d-end{animation-delay:6s}
.pod-wrap{gap:6px}
.pod-stage{position:relative;width:min(600px,100%);margin-top:clamp(50px,11vh,110px);display:flex;flex-direction:column;align-items:center;animation:cin .9s .4s both}
.pod-spot{position:absolute;left:50%;bottom:20%;width:130%;height:230%;transform:translateX(-50%);background:radial-gradient(ellipse 40% 55% at 50% 60%,rgba(255,236,180,.32),transparent 70%);pointer-events:none;animation:spotOn 1.2s 1s both}
@keyframes spotOn{from{opacity:0}to{opacity:1}}
.pod-team{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:.5%;width:100%;z-index:2}
.pod-fig{width:14%;aspect-ratio:2/3;transform-origin:50% 100%;transform:scale(var(--sc));animation:hop var(--hop) calc(var(--d) + .7s) ease-in-out infinite alternate}
.pod-fig.cap{width:20%;animation:none}
.pod-fig .arm{animation-delay:var(--d)!important}
@keyframes hop{from{transform:scale(var(--sc)) translateY(0)}to{transform:scale(var(--sc)) translateY(-9%)}}
.pod-trophy{position:absolute;left:50%;bottom:34%;z-index:3;transform:translateX(-50%);animation:podlift 2.4s calc(var(--tt) - 2.4s) cubic-bezier(.5,0,.25,1) both,podbob 1.6s calc(var(--tt) + .2s) ease-in-out infinite alternate;filter:drop-shadow(0 0 28px rgba(244,183,64,.85))}

@keyframes podlift{0%{bottom:22%;opacity:0}12%{opacity:1}100%{bottom:88%;opacity:1}}
@keyframes podbob{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) translateY(-6px) rotate(3deg)}}

.pod-lights{display:flex;justify-content:space-between;width:96%;margin-top:6px}
.pod-lights i{width:8px;height:8px;border-radius:50%;background:#fff4b8;box-shadow:0 0 12px 3px rgba(255,228,150,.7);animation:blink 1.1s calc(var(--i) * .12s) ease-in-out infinite alternate}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.podlift .lift-text{margin-top:14px}
.podlift .champ{font-size:clamp(30px,7.5vw,64px);text-wrap:balance}
.cine.skip .pod-trophy{animation:none;bottom:88%}
@media (prefers-reduced-motion:reduce){.pod-fig,.pod-trophy,.pod-lights i,.pod-block::before{animation:none}.pod-trophy{bottom:88%}}

/* =========================================================
   SOUND — a stadium announcer, goal roars and trophy music.
   All made in the browser (Web Speech + Web Audio), all switchable.
   ========================================================= */
const SND_KEY='touchline-sound-v1';
let SND=(()=>{const d={voice:true,goal:true,music:true,vol:.8};try{return {...d,...JSON.parse(localStorage.getItem(SND_KEY)||'{}')}}catch(e){return d}})();
function saveSnd(){try{localStorage.setItem(SND_KEY,JSON.stringify(SND))}catch(e){}}
let AC=null,_voice=null,_unlocked=false;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function voiceScore(v){
  let sc=0;const n=v.name||'';
  if(/Premium|Enhanced|Neural|Natural|Online/i.test(n))sc+=50;
  if(/Google UK English Male|Arthur|Jamie|Daniel|Oliver|Ryan|Thomas|Malcolm|Lee|Gordon/i.test(n))sc+=12;
  if(/Google/i.test(n))sc+=8;
  if(/en[-_]GB/i.test(v.lang))sc+=10;else if(/en[-_](AU|IE)/i.test(v.lang))sc+=6;else if(/^en/i.test(v.lang))sc+=3;else sc-=100;
  if(/compact|novelty|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Zarvox|Trinoids|Whisper|Jester|Organ|Superstar|Ralph|Fred|Junior|Kathy|Princess|Good News/i.test(n))sc-=80;
  return sc;
}
function engVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){return []}}
function pickVoice(){
  try{const vs=speechSynthesis.getVoices();if(!vs.length)return null;
    if(SND.voiceName){const f=vs.find(v=>v.name===SND.voiceName);if(f)return f}
    return engVoices()[0]||vs[0]}catch(e){return null}
}
try{speechSynthesis.onvoiceschanged=()=>{_voice=pickVoice()}}catch(e){}
function unlockAudio(){if(_unlocked)return;_unlocked=true;ac();try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
try{document.addEventListener('pointerdown',unlockAudio,{passive:true});document.addEventListener('keydown',unlockAudio)}catch(e){}

function say(text,opt){
  if(!SND.voice||!text)return;
  try{
    if(opt&&opt.interrupt)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);_voice=_voice||pickVoice();if(_voice)u.voice=_voice;
    u.lang=(_voice&&_voice.lang)||'en-GB';u.rate=((opt&&opt.rate)||1)*(.97+Math.random()*.06);u.pitch=((opt&&opt.pitch)||1)*(.96+Math.random()*.08);u.volume=Math.min(1,SND.vol+.1);
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){try{speechSynthesis.cancel()}catch(e){}}

/* --- synth helpers --- */
function noiseBuf(c,sec){const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function env(g,t,a,peak,dec,c){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak*SND.vol),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)}
function crowd(peak,dur,freq){
  const c=ac();if(!c)return;const t=c.currentTime,src=c.createBufferSource();src.buffer=noiseBuf(c,dur+.3);
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=freq||900;bp.Q.value=.6;
  const g=c.createGain();env(g,t,.18,peak,dur,c);src.connect(bp).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+.3);
}
function tone(f,t,dur,type,peak,c,lp){
  const o=c.createOscillator(),g=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  let node=o;if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;o.connect(fl);node=fl}
  env(g,t,.03,peak,dur,c);node.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.1);
}
function horn(c,t){[233,311].forEach(f=>tone(f,t,.55,'sawtooth',.06,c,1400))}
function drumHit(c,t,peak){const s=c.createBufferSource();s.buffer=noiseBuf(c,.4);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=c.createGain();env(g,t,.005,peak,.35,c);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+.4);tone(70,t,.3,'sine',peak*.8,c)}
function cymbal(c,t){const s=c.createBufferSource();s.buffer=noiseBuf(c,2.2);const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=5000;const g=c.createGain();env(g,t,.01,.18,1.9,c);s.connect(f).connect(g).connect(c.destination);s.start(t);s.stop(t+2.2)}

function ambience(box){
  if(!SND.goal)return;const c=ac();if(!c)return;
  const src=c.createBufferSource();src.buffer=noiseBuf(c,4);src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=.5;
  const g=c.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(.05*SND.vol,c.currentTime+1);
  src.connect(bp).connect(g).connect(c.destination);src.start();
  const stop=()=>{try{g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.6);src.stop(c.currentTime+.7)}catch(e){}};
  const mo=new MutationObserver(()=>{if(!box.isConnected){mo.disconnect();stop()}});mo.observe(document.getElementById('modal'),{childList:true});
}
/* --- the sounds the game uses --- */
const SFX={
  goalUs(){if(!SND.goal)return;const c=ac();if(!c)return;crowd(.5,2.6,850);horn(c,c.currentTime+.05)},
  goalThem(){if(!SND.goal)return;crowd(.16,1.2,500)},
  pkScore(){if(!SND.goal)return;crowd(.32,1.4,900)},
  pkMiss(){if(!SND.goal)return;crowd(.14,1,420)},
  whistle(){if(!SND.goal)return;const c=ac();if(!c)return;const t=c.currentTime;[0,.32,.64].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain(),lfo=c.createOscillator(),lg=c.createGain();o.type='sine';o.frequency.value=2900;lfo.frequency.value=34;lg.gain.value=180;lfo.connect(lg).connect(o.frequency);env(g,t+d,.01,.07,i===2?.75:.22,c);o.connect(g).connect(c.destination);o.start(t+d);lfo.start(t+d);o.stop(t+d+1);lfo.stop(t+d+1)})},
  drumroll(sec){if(!SND.music)return;const c=ac();if(!c)return;const t=c.currentTime;const n=Math.floor(sec*14);for(let i=0;i<n;i++)drumHit(c,t+i/14,.05+.12*(i/n))},
  sting(win){if(!SND.music)return;const c=ac();if(!c)return;const t=c.currentTime;cymbal(c,t);drumHit(c,t,.35);
    const ch=win?[261.6,329.6,392,523.3,659.3]:[220,261.6,329.6,440];ch.forEach((f,i)=>{tone(f,t+i*.015,2.4,'triangle',.07,c);tone(f/2,t,2.4,'sawtooth',.025,c,900)})},
  fanfare(){if(!SND.music)return;const c=ac();if(!c)return;const t=c.currentTime+.05;
    // an original rising brass fanfare in C: two pickups, a climb, then a held chord
    const seq=[[392,0,.18],[392,.2,.18],[523.3,.42,.32],[659.3,.8,.32],[784,1.18,.5],[659.3,1.75,.2],[784,1.98,.9]];
    seq.forEach(([f,d,l])=>{tone(f,t+d,l,'sawtooth',.05,c,2200);tone(f,t+d,l,'triangle',.05,c)});
    [261.6,329.6,392,523.3].forEach(f=>{tone(f,t+1.98,2.6,'sawtooth',.03,c,1600);tone(f/2,t+1.98,2.6,'triangle',.04,c)});
    for(let i=0;i<8;i++)drumHit(c,t+1.98+i*.09,.06+i*.01);cymbal(c,t+1.98);crowd(.35,4,800);
  }
};

/* --- watch the screen and react to what is shown --- */
let sndTimers=[];
function clearSnd(){sndTimers.forEach(clearTimeout);sndTimers=[];hush()}
function later(sec,fn){sndTimers.push(setTimeout(fn,Math.max(0,sec*1000)))}
function cssSec(el,name,def){if(!el)return def;const v=(el.style.getPropertyValue(name)||getComputedStyle(el).getPropertyValue(name)||'').trim();const n=parseFloat(v);return isFinite(n)?n:def}
const txt=el=>el?el.textContent.replace(/\s+/g,' ').trim():'';

function onCine(cine){
  clearSnd();
  const skip=()=>cine.classList.contains('skip');
  // awards night: drumroll on "and the winner is", then the name
  if(cine.classList.contains('cere')||cine.querySelector('.aw-reveal')){
    const stage=cine.matches('.cere')?cine:cine.querySelector('.aw-stage');
    const tW=cssSec(stage,'--tw',2),tR=cssSec(stage,'--tr',3);
    const award=txt(cine.querySelector('.aw-q'))||txt(cine.querySelector('.aw-eyebrow')).split(' · ')[0];
    const yr=(txt(cine.querySelector('.aw-eyebrow')).match(/(\d{4})/)||[])[1]||'';
    const nameEl=cine.querySelector('.aw-name'),name=txt(nameEl),meta=txt(cine.querySelector('.aw-meta'));
    const me=nameEl&&!nameEl.classList.contains('other')&&!nameEl.classList.contains('friend'),fr=nameEl&&nameEl.classList.contains('friend');
    const club=(meta.split('·').slice(-1)[0]||'').replace(/That's you!|Your friend!/g,'').trim();
    const lost=cine.classList.contains('lost')&&!cine.classList.contains('cere');
    const reveal=()=>{SFX.sting(me||fr);if(SND.goal)crowd(.3,3,850);
      say(lost?`${name} wins it. You finish in the top three.`:me?`${name}! It's you! Congratulations!`:fr?`${name}! Your friend wins it!`:`${name}${club&&club!==name?', of '+club:''}!`,{rate:1.02})};
    if(skip()){say(`The ${award}${yr?' '+yr:''} goes to`);reveal();return}
    later(Math.max(0,tW-.2),()=>{SFX.drumroll(Math.max(1,tR-tW));say(`And the winner of the ${award}${yr?' '+yr:''} is`,{rate:.95})});
    later(tR+.1,reveal);
    watchSkip(cine,()=>{clearSnd();reveal()});
    return;
  }
  // trophy lift: the team name for trophies
  if(cine.classList.contains('lift')){
    const pod=cine.classList.contains('podlift');
    const comp=pod?txt(cine.querySelector('#cineTitle')):txt(cine.querySelector('.comp'));
    let who=txt(cine.querySelector('.eyebrow')).replace(/ · \d{4}\/\d{2}$/,'');const fr=/^Your friend · /.test(who);who=who.replace(/^Your friend · /,'');
    const sub=txt(cine.querySelector('.sub2'));
    const t=pod?cssSec(cine.querySelector('.pod-trophy'),'--tt',4.4)-.6:2;
    const go=()=>{SFX.fanfare();say(fr?`Your friend's team, ${who}, win the ${comp}!`:pick([`${who} win the ${comp}! ${who} are the champions!`,`There it is! The ${comp} belongs to ${who}!`,`Lift it high! ${who}, champions of the ${comp}!`,`What a moment! ${who} have won the ${comp}!`]),{rate:1.04,pitch:1.05})};
    if(skip())return go();
    later(t,go);watchSkip(cine,()=>{clearSnd();go()});
  }
}
function watchSkip(cine,fn){try{const mo=new MutationObserver(()=>{if(cine.classList.contains('skip')){mo.disconnect();fn()}});mo.observe(cine,{attributes:true,attributeFilter:['class']})}catch(e){}}

/* match teaser: goals, shootout kicks, full time */
function onTeaser(box){
  clearSnd();ambience(box);
  const evEl=box.querySelector('#tzEv');
  if(evEl)new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(li=>{
    if(!(li instanceof HTMLElement)||!li.classList.contains('goal'))return;
    const t=txt(li);if(/^PEN/.test(t))return;
    if(li.classList.contains('us')){SFX.goalUs();const who=t.replace(/^\d+'\s*GOAL!\s*/,'').replace(/ scores/,'');say(pick([`Goal! ${who}!`,`It's in! ${who} scores!`,`What a finish from ${who}!`,`${who}! Into the back of the net!`,`And it's there! ${who}!`]),{rate:1.12,pitch:1.08,interrupt:true})}else SFX.goalThem();
  }))).observe(evEl,{childList:true});
  ['pkL','pkR'].forEach(id=>{const el=box.querySelector('#'+id);if(el)new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.classList)n.classList.contains('ok')?SFX.pkScore():SFX.pkMiss()}))).observe(el,{childList:true})});
  const call=box.querySelector('#pkCall');
  if(call)new MutationObserver(()=>{const t=txt(call);if(/win on penalties|Heartbreak/i.test(t))say(t.replace(/\s\d+–\d+$/,''),{interrupt:true});else if(/steps up/.test(t))say(t.replace('…',''),{rate:1.1,interrupt:true})}).observe(call,{childList:true,subtree:true,characterData:true});
  const ok=box.querySelector('#tzOk');
  if(ok)new MutationObserver(()=>{if(!ok.hidden){SFX.whistle()}}).observe(ok,{attributes:true,attributeFilter:['hidden']});
}
try{
  const target=document.getElementById('modal');
  if(target)new MutationObserver(()=>{
    const cine=target.querySelector('.cine');if(cine&&!cine.dataset.sndSeen){cine.dataset.sndSeen='1';onCine(cine);return}
    const tz=target.querySelector('.teaser');if(tz&&!tz.dataset.sndSeen){tz.dataset.sndSeen='1';onTeaser(tz);return}
    if(!cine&&!tz)clearSnd();
  }).observe(target,{childList:true,subtree:false});
}catch(e){}

function openSound(){

  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sndT"><div class="modal-box pop">
    <span class="label">Settings</span><h2 id="sndT">Sound</h2>
    ${row('voice','Commentary voice','An announcer reads out winners at trophy lifts and awards nights, and calls goals and penalties')}
    ${row('goal','Match sounds','Crowd roar and horn for goals, penalty kicks and the final whistle')}
    ${row('music','Trophy & award music','Fanfare when you lift a trophy, drumroll and reveal sting at awards nights')}
    <label class="snd-row"><span><b>Commentator</b><small>Best-sounding voices are listed first</small></span><select id="sndVoice">${engVoices().map(v=>`<option ${(_voice||pickVoice())&&(_voice||pickVoice()).name===v.name?'selected':''}>${esc(v.name)}</option>`).join('')||'<option>Default</option>'}</select></label>
    <details class="snd-help"><summary>Make the commentator sound more human</summary><p class="hint">Phones come with basic robotic voices. Download a free high-quality one, then pick it above.<br><b>iPhone:</b> Settings → Accessibility → Spoken Content → Voices → English → pick a voice marked <b>Premium</b> or <b>Enhanced</b> (e.g. Arthur, Jamie or Daniel, UK) → download. Then reopen the game.<br><b>Android:</b> Settings → Accessibility → Text-to-speech → Google → install English (UK) voice data.<br><b>Computer:</b> Chrome and Edge include natural "Google UK English Male" or "Online (Natural)" voices.</p></details>
    <label class="snd-row"><span><b>Volume</b><small>${Math.round(SND.vol*100)}%</small></span><input type="range" min="0.1" max="1" step="0.1" value="${SND.vol}" id="sndVol"></label>
    <p class="hint" style="margin:0">On iPhone, turn off silent mode to hear sound effects. The voice uses your phone's built-in speech.</p>
    <div class="actions"><button class="btn" id="sndTest">Test</button><button class="btn primary" id="sndOk">Done</button></div></div></div>`;
  modal.querySelectorAll('[data-sk]').forEach(i=>i.onchange=()=>{SND[i.dataset.sk]=i.checked;saveSnd();if(!i.checked&&i.dataset.sk==='voice')hush()});
  sndVoice.onchange=()=>{SND.voiceName=sndVoice.value;saveSnd();_voice=pickVoice();hush();say('Welcome to the stadium. What a night this is going to be!',{rate:1.03})};
  sndVol.oninput=()=>{SND.vol=+sndVol.value;saveSnd();sndVol.previousElementSibling.querySelector('small').textContent=Math.round(SND.vol*100)+'%'};
  sndTest.onclick=()=>{unlockAudio();SFX.goalUs();setTimeout(()=>SFX.fanfare(),1500);say('And the winner of the Ballon d\'Or is… you!')};
  sndOk.onclick=()=>{modal.innerHTML='';hush()};
}

function checkMilestones(f,res){
  if(!res||!res.min||isMgrNow())return;

  if(S.academy){if(res.g>=3)milestone('Academy hat-trick','Three goals in one youth game. The scouts are taking notes.');return}
  const before={...T};T.apps++;T.g+=res.g||0;T.a+=res.a||0;
  if(before.apps===0)milestone('Professional debut',`Your first senior game, for ${myClub().n}, aged ${P().age}.`);
  if(before.g===0&&T.g>0)milestone('First professional goal',`The first of many? You score against ${team(res.opp).n}.`);
  [50,100,150,200,300,400,500,600,700,800,900,1000].forEach(n=>{if(before.g<n&&T.g>=n)milestone(`${n} career goals`,`Goal number ${n} goes in against ${team(res.opp).n}.`)});
  [100,250,400,500,750,1000].forEach(n=>{if(before.apps<n&&T.apps>=n)milestone(`${n} career appearances`,`Appearance number ${n}. A career built to last.`)});
  [100,200,300].forEach(n=>{if(before.a<n&&T.a>=n)milestone(`${n} career assists`,'The ultimate team player.')});
  if((res.g||0)>=3){T.ht++;if([1,5,10,25,50].includes(T.ht))milestone(T.ht===1?'First hat-trick':`${T.ht} career hat-tricks`,`${res.g} goals against ${team(res.opp).n}. The match ball is yours.`)}
  if(intl){const ic=S.intl.caps,ig=S.intl.goals;
    if(ic===1)milestone('International debut',`You pull on the ${P().nation} shirt for the first time.`);
    if(ig>=1&&!life().milestones.some(m=>m.t==='First international goal'))milestone('First international goal',`Your first goal for ${P().nation}.`);
    [50,100,150].forEach(n=>{if(ic===n)milestone(`${n} caps for ${P().nation}`,'A true international servant.')});
    [25,50,100].forEach(n=>{if(ig>=n&&!life().milestones.some(m=>m.t===`${n} international goals`))milestone(`${n} international goals`,`Only legends reach ${n} for their country.`)})}
  if(derbyOf(f)&&res.outcome==='W'){addFollowers(5000+life().followers*.01);if(res.g)milestone(`Scored in the ${derbyOf(f)}`,'Derby heroes are never forgotten.')}

}

function assistantTips(){
  const m=M(),f=curFixture();if(!f)return [];
  const o=team(f.opp),me=mgrStrength(),xi=pickXI(),tips=[];
  const diff=o.s-me;
  if(diff>3)tips.push(`${o.n} are stronger (${Math.round(o.s)} vs ${Math.round(me)}). Counter-attack or Park the bus usually works best.`);
  else if(diff<-3)tips.push(`We're stronger (${Math.round(me)} vs ${Math.round(o.s)}). Possession or All-out attack should break them down.`);
  else tips.push(`It's an even game (${Math.round(me)} vs ${Math.round(o.s)}). Balanced or High press could tip it.`);
  const tired=xi.filter(x=>x.p.fit<78);if(tired.length)tips.push(`${tired.length} starter${tired.length>1?'s are':' is'} tired (${tired.slice(0,3).map(x=>x.p.n).join(', ')}). Try "Rest tired players".`);
  const oop=xi.filter(x=>x.oop);if(oop.length)tips.push(`${oop.map(x=>x.p.n).join(', ')} ${oop.length>1?'are':'is'} out of position. Change formation or sign cover.`);
  const inj=sq().filter(p=>p.inj>0).length;if(inj)tips.push(`${inj} player${inj>1?'s':''} injured.`);
  if(m.morale<40)tips.push('Morale is low. A win, or backing the players in the press, would help.');
  if(derbyOf(f))tips.push(`It's the ${derbyOf(f)}. The fans will remember this one.`);
  return tips;
}

async function unpackSave(code){

  const auth=firebase.auth(),cred=firebase.auth.EmailAuthProvider.credential(accEmail(u),p);
  if(auth.currentUser&&auth.currentUser.isAnonymous)await auth.currentUser.linkWithCredential(cred);
  else{await auth.createUserWithEmailAndPassword(accEmail(u),p)}
  accRefresh();save();publishCareer();
}
async function accLogin(u,p){
  u=cleanUser(u);if(!validUser(u))throw {msg:'Username needs 3–20 letters or numbers (no spaces or emoji).'};
  const auth=firebase.auth(),guest=auth.currentUser&&auth.currentUser.isAnonymous;
  await auth.signInWithEmailAndPassword(accEmail(u),p);
  // this phone now belongs to that account: load its careers fresh
  try{localStorage.removeItem(KEY);localStorage.removeItem(ARCH_KEY)}catch(e){}
  location.reload();
}
async function accLogout(){
  archiveCurrent();
  try{await firebase.auth().signOut()}catch(e){}
  try{localStorage.removeItem(KEY);localStorage.removeItem(ARCH_KEY)}catch(e){}
  location.reload();
}

function svgImg(svg){
  return new Promise((res,rej)=>{
    if(!/xmlns=/.test(svg))svg=svg.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
    const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function siteLink(){try{return /^https?:/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname)?(location.host+location.pathname).replace(/\/$/,''):'Touchline'}catch(e){return 'Touchline'}}
function wrapText(x,text,maxW){const words=String(text).split(' '),lines=[];let cur='';words.forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
async function makeCard(o){
  // o: {kicker, title, name, line, stats:[[label,value]], trophyKind, k1, k2, list:[...]}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const g=x.createRadialGradient(W/2,260,60,W/2,520,900);g.addColorStop(0,'#2c4a36');g.addColorStop(.55,'#0f2318');g.addColorStop(1,'#060d09');x.fillStyle=g;x.fillRect(0,0,W,H);
  // floodlight beams
  x.save();x.globalAlpha=.08;x.fillStyle='#fff4c8';[[-80,0,380],[W+80,0,W-380]].forEach(([a,b,c])=>{x.beginPath();x.moveTo(a,b);x.lineTo(c+120,H);x.lineTo(c-120,H);x.closePath();x.fill()});x.restore();
  // kit stripe
  if(o.k1){x.fillStyle=o.k1;x.fillRect(0,0,W,16);x.fillStyle=o.k2||o.k1;x.fillRect(0,16,W,8)}
  x.textAlign='center';x.textBaseline='alphabetic';
  x.fillStyle='#eef1e4';x.font='900 64px Impact, "Arial Black", sans-serif';const lw=x.measureText('TOUCH').width,lw2=x.measureText('LINE').width;
  x.textAlign='left';x.fillText('TOUCH',W/2-(lw+lw2)/2,110);x.fillStyle='#f4b740';x.fillText('LINE',W/2-(lw+lw2)/2+lw,110);x.textAlign='center';
  x.fillStyle='#9db1a0';x.font='600 30px "Courier New", monospace';x.fillText(String(o.kicker||'').toUpperCase(),W/2,170);
  let y=200;
  if(o.trophyKind){try{const im=await svgImg(trophySVG(o.trophyKind,300));const h=430,w=h*im.width/im.height;x.save();x.shadowColor='rgba(244,183,64,.6)';x.shadowBlur=70;x.drawImage(im,W/2-w/2,y,w,h);x.restore();y+=h+40}catch(e){y+=40}}
  x.fillStyle='#f4b740';x.font='900 76px Impact, "Arial Black", sans-serif';wrapText(x,String(o.title||'').toUpperCase(),W-120).slice(0,2).forEach(l=>{y+=78;x.fillText(l,W/2,y)});
  x.fillStyle='#eef1e4';x.font='800 54px "Arial Black", Arial, sans-serif';y+=80;x.fillText(o.name||'',W/2,y);
  x.fillStyle='#9db1a0';x.font='500 34px Arial, sans-serif';if(o.line){y+=56;wrapText(x,o.line,W-140).slice(0,2).forEach((l,i)=>{if(i)y+=44;x.fillText(l,W/2,y)})}
  if(o.stats&&o.stats.length){y+=60;const n=o.stats.length,bw=(W-120)/n;o.stats.forEach(([lab,val],i)=>{const cx=60+bw*i+bw/2;x.fillStyle='rgba(255,255,255,.06)';x.fillRect(60+bw*i+8,y,bw-16,130);x.fillStyle='#f4b740';x.font='900 56px Impact, "Arial Black", sans-serif';x.fillText(String(val),cx,y+70);x.fillStyle='#9db1a0';x.font='600 22px "Courier New", monospace';x.fillText(String(lab).toUpperCase(),cx,y+108)});y+=130}
  if(o.list&&o.list.length){x.font='600 30px Arial, sans-serif';x.fillStyle='#eef1e4';o.list.slice(0,6).forEach(l=>{y+=46;if(y<H-110)x.fillText(l,W/2,y)})}
  x.fillStyle='#6f8a76';x.font='600 28px "Courier New", monospace';x.fillText('Play: '+siteLink(),W/2,H-50);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function shareBlob(blob,name,text){
  const file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return 'shared'}}catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  try{const dl=window.claude&&window.claude.use&&!FBMODE?await window.claude.use('downloads').catch(()=>null):null;if(dl){await dl.save({filename:name,data:blob});return 'saved'}}catch(e){return 'cancel'}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return 'saved';
}
async function shareCard(o,btn){
  const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Making card…'}
  try{const blob=await makeCard(o);await shareBlob(blob,'touchline-'+String(o.title||'card').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'.png',`${o.title} · ${o.name} · Touchline`)}catch(e){}
  if(btn){btn.disabled=false;btn.textContent=old}
}
function careerCardData(){
  const p=P(),H=S.history.filter(h=>!h.youth),tr=S.trophies.filter(t=>!t.youth),aw=S.awards.filter(a=>!a.youth),c=myClub();
  const bd=aw.filter(a=>/Ballon/.test(a.n)).length,maj=tr.filter(t=>MAJOR.includes(t.n)||/World Cup|European Championship|Copa América/.test(t.n)).map(t=>`${t.n} ${t.y}`);
  return {kicker:`${isMgrNow()?'Manager':POS[p.pos].name} · ${p.nation} · age ${p.age}`,title:'My career',name:p.name,line:`${[...new Set(H.map(h=>h.club))].slice(-4).join(' → ')||c.n}`,
    stats:[['Apps',H.reduce((a,h)=>a+h.apps,0)],['Goals',H.reduce((a,h)=>a+h.g,0)],['Trophies',tr.length],['Awards',aw.length]],
    list:(bd?[`${bd}× Ballon d'Or`]:[]).concat(maj.slice(-5)),k1:c.k1,k2:c.k2,trophyKind:bd?trophyKind("Ballon d'Or"):tr.length?trophyKind(tr[tr.length-1].n):null};
}

/* Strength used for shared cup results. It must NOT depend on which friends have
   synced yet, so it uses only the base club rating plus the shared seeded drift. */
function partyTeamStrength(id,year){
  if(String(id).startsWith('N:')){const n=nation(String(id).split(':')[1]);return n?n[1]:60}
  try{const [l,c]=String(id).split('-').map(Number);return LEAGUES[l].clubs[c].s+partyDrift(id,year)}catch(e){return 70}
}
function partyKOPlan(compName,year,stages,isIntl,conf,league){
  const key=`${S.party}|ko|${year}|${compName}`;
  if(!S.koPlan)S.koPlan={};if(S.koPlan[key])return S.koPlan[key];
  // every team that could be in it, the same list for every friend
  let cands=isIntl?NATIONS.map(n=>'N:'+n[0])
    :(league!=null?LEAGUES[league].clubs.map((_,i)=>league+'-'+i):allProAll().filter(id=>conf==='ALL'||LEAGUES[+id.split('-')[0]].conf===conf));
  cands=[...new Set(cands)].sort();
  const rng=srng(key),w=cands.map(id=>Math.exp((partyTeamStrength(id,year)-80)/4)),tot=w.reduce((a,b)=>a+b,0);
  let r=rng()*tot,champ=cands[0];for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0){champ=cands[i];break}}
  return (S.koPlan[key]={champ,stages});

function koExitStage(compName,year,id,n){

  return st; // the stage where this team goes out (n-1 = loses the final)
}

  const year=S.season.year,us=ourTeam(f).id,n=comp.stages.length;

  const conf=isIntl?null:(f.c==='cwc'?'ALL':LEAGUES[myClub().l].conf);

/* =========================================================
   REALISTIC BALLON D'OR ODDS
   Your award score now sits on the same scale as the real stars:
   overall above 86 counts for less, form/trophy/goal bonuses are
   capped, voters tire of the same winner, and every season has luck.
   ========================================================= */
myAwardScore=function(o,avg,st,ist,tr){
  const p=P(),pos=POS[p.pos],apps=st.apps+ist.apps,g=st.goals+ist.goals,a=st.ast+ist.ast;
  const oe=o<=86?o:86+(o-86)*.5;
  let s=oe+pos.adj;
  s+=clamp((avg-7)*2.2,-3,2.5)*Math.min(1,apps/26);
  s+=Math.min(2.5,tr.reduce((x,t)=>x+(MAJOR.includes(t)?1.2:/World Cup|Championship|Copa América|Asian Cup|Africa Cup|Gold Cup/.test(t)?.9:/U-\d/.test(t)?0:.35),0));
  s+=Math.min(1.5,p.pos==='FWD'?(g+a*.6)*.025:p.pos==='MID'?(g+a)*.03:(st.cs+ist.cs)*.06+g*.04);
  s+=Math.min(.6,st.motm*.03+(st.potm||0)*.1);
  s-=D().gb*.4;
  const won=(S.awards||[]).filter(x=>/Ballon/.test(x.n)).length;
  s-=won*.8;            // voters look for a new name
  s+=n01()*2.2;         // every season has its own story
  if(apps<16)s-=12;
  return s;
};

        <div class="stats4">${sStats.map(([k,v])=>`<div><span class="label">${k}</span><b>${v}</b></div>`).join('')}</div>
      </div>
      ${compsPanel()}
      <div class="panel">
        <div class="panel-head"><h3>${esc(lg.name)}</h3><span class="label">${lg.youth?'Academy league':(lg.coef>=2?'Top 4':'Top 2')+' → '+esc(contName(se.l))}</span></div>
        <div class="scroll"><table><thead><tr><th>#</th><th>Club</th><th>P</th><th>W-D-L</th><th>GD</th><th>Pts</th></tr></thead><tbody>
        ${tbl.map((t,i)=>{const cc=lg.clubs[t.i];return `<tr class="${t.i===c.c?'me':''}"><td>${i+1}</td><td><span class="dot" style="background:${cc.k1}"></span>${esc(cc.n)}</td><td>${t.P}</td><td>${t.W}-${t.D}-${t.L}</td><td>${t.GF-t.GA>0?'+':''}${t.GF-t.GA}</td><td><b>${t.Pts}</b></td></tr>`}).join('')}
        </tbody></table></div>
      </div>
      <div class="panel"><div class="panel-head"><h3>Headlines</h3></div>
        <ul class="feed">${(S.news||[]).slice(0,6).map(n=>`<li><span class="label">${n.y}</span>${esc(n.t)}</li>`).join('')}</ul></div>
    </div>
  </section>
  ${careerStrip()}`;
  bindTop();
  if(f){
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.training.focus=+b.dataset.f;save();renderHub()});
    document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.training.int=b.dataset.i;save();renderHub()});
    play.onclick=onPlay;sim.onclick=onSim;
  }
  const rp=document.getElementById('replay');if(rp)rp.onclick=()=>showTeaser(se.last,true);
  document.querySelectorAll('[data-hl]').forEach(b=>b.onclick=()=>{const x=se.log[+b.dataset.hl];if(x&&x.ev)showTeaser(x,true)});
  bindNewCareer();
}
function scoreLine(m){
  const us=team(m.our),them=team(m.opp);
  const L=m.home||m.neutral?us:them,Rt=m.home||m.neutral?them:us,a=m.home||m.neutral?m.gA:m.gB,b=m.home||m.neutral?m.gB:m.gA;
  return `${esc(L.n)} ${a}–${b} ${esc(Rt.n)}${m.pens?` <span class="label">(pens ${m.pensScore[m.home||m.neutral?0:1]}–${m.pensScore[m.home||m.neutral?1:0]})</span>`:''}`;
}

/* ---------- Match highlights (teaser) ---------- */
let teaserTimer=null;
function showTeaser(m,replay){
  clearInterval(teaserTimer);
  const us=team(m.our),them=team(m.opp),L=m.home||m.neutral?us:them,Rt=m.home||m.neutral?them:us,usLeft=m.home||m.neutral;
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="tz"><div class="modal-box teaser pop">
    <span class="label">${esc(m.comp)} · ${esc(m.stage)}</span>
    <div class="tz-board">
      <div class="tz-team"><span class="crest" style="${crest(L.k1,L.k2)}"></span><b id="tz">${esc(L.n)}</b></div>
      <div class="tz-score"><span id="tzA">0</span>–<span id="tzB">0</span><small id="tzMin">0'</small></div>
      <div class="tz-team r"><span class="crest" style="${crest(Rt.k1,Rt.k2)}"></span><b>${esc(Rt.n)}</b></div>
    </div>
    <div class="tz-pitch"><i id="tzBar"></i><span id="tzBall"></span></div>
    <ol class="tz-ev" id="tzEv"></ol>
    <div class="actions"><button class="btn" id="tzSkip">Skip to full time</button><button class="btn primary" id="tzOk" hidden>Continue</button></div>
  </div></div>`;
  const ev=m.ev||[],evEl=document.getElementById('tzEv');
  let i=0,minute=0,a=0,b=0;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const add=e=>{
    if(e.k==='goal'&&e.m<=90){if(e.s==='us'){usLeft?a++:b++}else{usLeft?b++:a++}tzA.textContent=a;tzB.textContent=b}
    const li=document.createElement('li');li.className=`ev ${e.k} ${e.s}${e.me?' me':''}`;
    li.innerHTML=`<span class="num">${e.m>90?'PEN':e.m+"'"}</span><span>${e.k==='goal'&&e.m<=90?'GOAL! ':''}${esc(e.t)}</span>`;
    evEl.appendChild(li);evEl.scrollTop=evEl.scrollHeight;
  };
  const finish=()=>{clearInterval(teaserTimer);while(i<ev.length)add(ev[i++]);tzA.textContent=usLeft?m.gA:m.gB;tzB.textContent=usLeft?m.gB:m.gA;tzMin.textContent='FT';tzBar.style.width='100%';tzSkip.hidden=true;tzOk.hidden=false;tzOk.focus()};
  const tick=()=>{
    minute+=1;tzMin.textContent=minute+"'";tzBar.style.width=(minute/90*100)+'%';
    tzBall.style.left=clamp(50+n01()*22,6,94)+'%';
    while(i<ev.length&&ev[i].m<=minute)add(ev[i++]);
    if(minute>=90)finish();
  };
  if(reduce)finish();else teaserTimer=setInterval(tick,70);
  tzSkip.onclick=finish;
  tzOk.onclick=()=>{clearInterval(teaserTimer);modal.innerHTML='';if(!replay){S.teaser=false;save();showNextModal()||resumeAfterModal()}};
}

/* ---------- Trophy celebrations ---------- */
function confetti(box){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confetti';box.appendChild(cv);
  const W=cv.width=box.clientWidth,H=cv.height=box.clientHeight,ctx=cv.getContext('2d');
  const cols=['#f4b740','#fff4b8','#eef1e4','#6fd497','#ef6a52'];
  const parts=Array.from({length:110},()=>({x:Math.random()*W,y:-Math.random()*H*.6,v:R(1.5,4),r:R(3,7),a:Math.random()*6,c:pick(cols)}));
  let t=0;const step=()=>{ctx.clearRect(0,0,W,H);parts.forEach(p=>{p.y+=p.v;p.x+=Math.sin(t/20+p.a)*.8;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t/15+p.a);ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});t++;if(t<260&&cv.isConnected)requestAnimationFrame(step);else cv.remove()};step();
}
function showCelebrationClassic(){
  const c=S.cele.shift();if(!c)return false;
  const kind=trophyKind(c.n),isAward=['ball','boot','glove','statue'].includes(kind);
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ce"><div class="modal-box cele pop">
    <div class="cele-art">${trophySVG(kind,150)}</div>
    <span class="label">${isAward?'Individual award':'Trophy won'}${c.sub?' · '+esc(c.sub):''}</span>
    <h2 id="ce" class="cele-title">${esc(c.n)}</h2>
    <p class="intro" style="margin:0 auto">${kind==='ball'?`${esc(P().name)} is the best player on the planet.`:isAward?'Your name is engraved forever.':'Champions! Lift it high.'}</p>
    <div class="actions" style="justify-content:center"><button class="btn primary" id="ceOk">${S.cele.length?'Next':'Continue'}</button></div></div></div>`;
  confetti(modal.querySelector('.cele'));
  ceOk.onclick=()=>{modal.innerHTML='';save();showNextModal()||resumeAfterModal()};ceOk.focus();
  return true;
}
function showNotice(){
  const n=S.notice;if(!n)return false;
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nt"><div class="modal-box pop"><span class="label">Summer</span><h2 id="nt">${esc(n.t)}</h2><p style="margin:0">${esc(n.b)}</p><div class="actions"><button class="btn primary" id="ntOk">Let's go</button></div></div></div>`;
  ntOk.onclick=()=>{S.notice=null;modal.innerHTML='';save();showNextModal()||resumeAfterModal()};ntOk.focus();
  return true;
}
function showNextModal(){
  if(!S)return false;
  if(S.phase==='hub'&&S.pending&&S.pending.type&&!S.pending.mod){showMoment();return true}
  if(S.teaser&&S.season.last){showTeaser(S.season.last,false);return true}
  if(S.cele&&S.cele.length)return showCelebration();
  if(S.notice)return showNotice();
  if((S.phase==='hub'||S.phase==='mgrHub')&&S.event){showEvent();return true}
  return false;
}

/* ---------- Career strip & end of season ---------- */
function careerStrip(){
  const p=P(),pro=S.history.filter(h=>!h.youth);
  const goalsTot=pro.reduce((a,h)=>a+h.g,0),appsTot=pro.reduce((a,h)=>a+h.apps,0);
  const senior=S.trophies.filter(t=>!t.youth),youthT=S.trophies.filter(t=>t.youth);
  const shelf=(list,dim)=>list.map(t=>`<div class="trophy${dim?' dim':''}">${trophySVG(trophyKind(t.n),28)}<span>${esc(t.n)}<small>${t.y}${t.club?' · '+esc(t.club):''}</small></span></div>`).join('');
  return `<section class="career">
    <div class="panel"><div class="panel-head"><h3>Career history</h3><span class="label">Senior: ${appsTot} apps · ${goalsTot} goals · Legacy ${legacyOf(S)}</span></div>
      ${S.history.length?`<div class="scroll"><table class="hist"><thead><tr><th>Season</th><th>Club</th><th>Age</th><th>OVR</th><th>Apps</th><th>G</th><th>A</th><th>${p.pos==='GK'||p.pos==='DEF'?'CS':'MOTM'}</th><th>Avg</th><th>Pos</th><th>Caps</th><th>Ballon</th></tr></thead><tbody>
      ${S.history.slice().reverse().map(h=>`<tr><td style="text-align:left">${seasonLabel(h.y)}</td><td><span class="dot" style="background:${h.k1}"></span>${esc(h.club)}${h.youth?' <span class="tag">Youth</span>':h.loan?' <span class="tag">Loan</span>':''}</td><td>${h.age}</td><td>${h.ovr}</td><td>${h.apps}</td><td>${h.g}</td><td>${h.a}</td><td>${p.pos==='GK'||p.pos==='DEF'?h.cs:(h.motm||0)}</td><td>${h.avg?h.avg.toFixed(2):'–'}</td><td>${ord(h.pos)}</td><td>${h.caps||0}</td><td>${h.bd&&h.bd<=30?ord(h.bd):'–'}</td></tr>`).join('')}
      </tbody></table></div>`:`<p class="empty">Your first season will appear here once it's finished.</p>`}
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="panel-head" style="margin:0"><h3>Trophy cabinet</h3><span class="label">${senior.length} senior${youthT.length?' · '+youthT.length+' youth':''}</span></div>
      ${S.trophies.length?`<div class="cabinet">${shelf(senior)}${shelf(youthT,true)}</div>`:'<p class="empty">Empty for now. Win a league, cup or tournament to fill it.</p>'}
      ${S.awards.length?`<span class="label">Individual awards</span><div class="cabinet">${S.awards.map(a=>`<div class="trophy${a.youth?' dim':''}">${trophySVG(trophyKind(a.n),28)}<span>${esc(a.n)}<small>${a.y}</small></span></div>`).join('')}</div>`:''}
      <div class="kv"><span>${esc(p.nation)} caps</span><b>${S.intl.caps}</b><span>International goals</span><b>${S.intl.goals}</b><span>Youth caps</span><b>${S.intl.ycaps||0}</b><span>Player of the Month</span><b>${S.potm||0}</b><span>Best Ballon d'Or finish</span><b>${S.bdBest?ord(S.bdBest):'–'}</b><span>Injuries</span><b>${S.injLog.length}</b></div>
      ${S.intl.tourn.length?`<span class="label">Tournaments</span><ul class="list">${S.intl.tourn.map(t=>`<li><span class="label">${t.y}</span>${esc(t.name)}: ${esc(t.res)}</li>`).join('')}</ul>`:''}
    </div>
  </section>`;
}
function renderEnd(){
  const s=S.summary,p=P(),c=myClub(),lg=LEAGUES[S.season.l],gk=p.pos==='GK';
  const pa=s.st.pa?Math.round(s.st.pc/s.st.pa*100)+'%':'–';
  const v=s.votes||{};
  const nextLbl=s.youth?(p.age>=17||(p.age>=16&&S.scout>=75)?'See pro contract offers':'Next academy season'):'Open transfer window';
  app.innerHTML=`
  ${topBar(`End of season ${seasonLabel(s.year)}`)}
  <section class="panel pop" style="display:flex;flex-direction:column;gap:18px">
    <div><span class="label">${esc(c.n)} finished</span><div class="headline">${ord(s.pos)} in the ${esc(lg.name)}</div></div>
    ${s.tr.length||s.aw.length?`<div class="podium">${s.tr.map(t=>`<figure>${trophySVG(trophyKind(t),84)}<figcaption>${esc(t)}</figcaption></figure>`).join('')}${s.aw.map(a=>`<figure>${trophySVG(trophyKind(a),84)}<figcaption>${esc(a)}</figcaption></figure>`).join('')}</div>`:'<p class="empty" style="margin:0">No silverware this season.</p>'}
    <div class="big-grid">
      <div class="kv"><span>Club appearances</span><b>${s.st.apps} (${s.st.starts} starts)</b><span>Goals</span><b>${s.st.goals} (${s.st.lg} league)</b><span>Assists</span><b>${s.st.ast}</b>
        ${gk?`<span>Saves</span><b>${s.st.sv}</b>`:`<span>Shots (on target)</span><b>${s.st.sh} (${s.st.sot})</b><span>Key passes</span><b>${s.st.kp}</b><span>Tackles + interceptions</span><b>${s.st.tk+s.st.ic}</b>`}
        <span>Clean sheets</span><b>${s.st.cs}</b><span>Pass accuracy</span><b>${pa}</b><span>Player of the Month</span><b>${s.st.potm}</b><span>Red cards</span><b>${s.st.red}</b><span>Club avg rating</span><b>${s.clubAvg?s.clubAvg.toFixed(2):'–'}</b>${s.youth?'':`<span>League top scorer</span><b>${s.top} goals</b>`}</div>
      <div class="kv"><span>International apps</span><b>${s.ist.apps}</b><span>International goals</span><b>${s.ist.goals}</b><span>Overall</span><b>${s.oldOvr} → ${s.newOvr}</b><span>Age next season</span><b>${p.age}</b><span>Market value</span><b>${money(valueOf(p))}</b>
        ${s.youth?`<span>Scout interest</span><b>${Math.round(S.scout)}/100</b>`:`<span>Reputation</span><b>${Math.round(p.rep)}</b><span>Contract left</span><b>${S.contract.loan?'Loan ends':Math.max(0,S.contract.years)+' yr'}</b>`}</div>
      <div><span class="label">Competitions</span><ul class="comps" style="margin-top:8px">${s.comps.map(k=>`<li class="${k.won?'won':''}"><span>${k.won?trophySVG(trophyKind(k.n),18):''}${esc(k.n)}</span><small>${k.won?'Winners':k.elim?'Out in the '+esc(k.elim):'–'}</small></li>`).join('')}</ul></div>
    </div>
    ${S.pendVote?partyVoteWait():s.youth?'':`<div><span class="label">Awards night ${s.year+1}</span><div class="votes">${voteTable("Ballon d'Or",v.bd)}${voteTable('The Best FIFA Player',v.best)}${voteTable('Kopa Trophy (U21)',v.kopa)}${voteTable('Golden Boy (U21)',v.gboy)}${voteTable('Talent of the Year',v.talent)}${voteTable('Yashin Trophy',v.yashin)}</div></div>`}
    <div class="actions"><button class="btn primary" id="toTransfer" ${S.pendVote?'disabled':''}>${nextLbl}</button></div>
  </section>
  ${careerStrip()}`;
  bindTop();
  toTransfer.onclick=()=>{
    if(S.pendVote)return;
    if(s.youth&&!(p.age>=17||(p.age>=16&&S.scout>=75))){advanceYear();return}
    S.notice2=null;genOffers();save();render();window.scrollTo({top:0});
  };
}

function render(){
  if(view==='world'){renderWorld();return}
  if(!S){if(!draft)newDraft();renderSetup();return}
  if(S.phase==='hub')renderHub();
  else if(S.phase==='end')renderEnd();
  else if(S.phase==='transfer')renderTransfer();
  else if(S.phase==='retired')renderRetired();
  else if(S.phase==='waitNext')renderWait();
  else if(S.phase==='mgrHub')renderMgrHub();
  else if(S.phase==='mgrEnd')renderMgrEnd();
  else if(S.phase==='mgrJobs')renderMgrJobs();
  else if(S.phase==='mgrRetired')renderMgrRetired();
  if(!modal.innerHTML)showNextModal();
}
const app=document.getElementById('app'),modal=document.getElementById('modal');
S=load();if(S&&(!S.player||!S.stars||!S.season||!S.season.comps||!S.youth))S=null;
if(S)applyYear(S.year);
if(S&&!S.realStars){S.stars=S.year>=2024?(S.stars||[]).filter(s=>s.age<=20):[];S.realStars=true}
render();
initOnline();
</script>
